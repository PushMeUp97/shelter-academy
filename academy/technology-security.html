<script>
    // Complete dataset of 134 IT Governance multiple choice questions
    const qaData = [
        {q:"Which of the following is true about IT risk?", opts:["IT risk cannot be assessed and measured quantitatively.","IT risk should be calculated separately from business risk.","IT risk management is the responsibility of the IT department.","IT risk exists regardless of whether it is detected or recognized by an enterprise."], correct:"D", justification:"The enterprise must identify, acknowledge and respond to risk; ignorance of risk is not acceptable."},
        {q:"Which one of the following aspects is MOST important for an effective IT risk management process?", opts:["Addressing information security risk management","Addressing regulatory risk management","Aligning with financial risk management","Aligning with enterprise risk management"], correct:"D", justification:"Aligning IT risk management with ERM is most important because it ensures alignment of IT objectives with enterprise objectives."},
        {q:"Which of the following will have the MOST significant impact on standard information security governance models?", opts:["Number of employees and consulting staff","Cultural differences between physical locations","Complexity of the organizational structure","Uncertainty in legislative requirements"], correct:"C", justification:"Information security governance models are highly dependent on complexity of organizational structure."},
        {q:"Which of the following is MOST beneficial to improvement of an enterprise's risk management process?", opts:["Key risk indicators","External benchmarking","Latest risk assessment","A maturity model"], correct:"D", justification:"Maturity model helps identify status quo and path to desired state, most helpful for improving business processes."},
        {q:"What should be performed FIRST when establishing the IT risk framework of an enterprise?", opts:["Setting accountabilities and responsibilities for risk","Articulating the financial risk appetite for the enterprise","Allocating control owners for critical information systems","Endorsing a risk matrix that specifies risk tolerances"], correct:"A", justification:"Without ownership and accountability, the risk framework will not be driven forward."},
        {q:"The PRIMARY purpose of adopting an enterprise-wide risk management framework is to:", opts:["allow flexibility to adjust risk response strategy throughout enterprise.","centralize responsibility for maintenance of risk response program.","enable a consistent approach to risk response throughout enterprise.","avoid higher costs for risk reduction and audit strategies throughout enterprise."], correct:"C", justification:"Enabling consistent risk response is a key objective of the risk management framework."},
        {q:"Which of the following can provide the BEST perspective of risk management to an enterprise's employees and stakeholders?", opts:["An interdisciplinary team within the enterprise","A third-party risk assessment service provider","The enterprise's IT department","The enterprise's internal compliance department"], correct:"A", justification:"Interdisciplinary team ensures all areas are considered and provides enterprise-wide perspective on risk."},
        {q:"Which of the following requirements MUST be met during the initial stages of developing a risk management program?", opts:["Management establishes ownership of identified risk.","Information security policies and standards are established.","A management committee exists to provide program oversight.","The context and purpose of the program are defined."], correct:"D", justification:"Initial requirements include determining desired outcomes and defining objectives."},
        {q:"Which of the following is a PRIMARY consideration when developing an IT risk awareness program?", opts:["Why technology risk is owned by IT","How technology risk can affect each attendee's area of business","How business process owners can transfer technology risk","Why technology risk is more difficult to manage than other risk"], correct:"B", justification:"Stakeholders must understand how IT-related risk affects overall business and how threats can jeopardize enterprise."},
        {q:"Risk management strategic plans are MOST effective when developed for:", opts:["the enterprise as a whole.","each individual system based on technology used.","every location based on geographic threats.","end-to-end business processes."], correct:"A", justification:"Risk management strategic plans are most effective when created and followed by entire enterprise."},
        {q:"Which of the following is the MOST important information to include in a risk management strategic plan?", opts:["Risk management staffing requirements","Risk management mission statement","Risk mitigation investment plans","Current state and desired future state"], correct:"D", justification:"Must paint vision for future and road map from starting point, requiring current state and desired future state."},
        {q:"To be effective, risk management should be applied to:", opts:["the elements identified by a risk assessment.","any area that exceeds acceptable risk levels.","all enterprise activities.","only those areas that have potential impact."], correct:"C", justification:"Although not all activities entail unacceptable risk, practice of risk management is ideally applied to all enterprise activities."},
        {q:"What is the PRIMARY goal of an enterprise's IT risk management process?", opts:["Protect the enterprise's IT assets and its environment.","Protect the enterprise and its ability to perform its mission.","Report on the status of the IT risk register.","Ensure risk is identified and properly managed."], correct:"B", justification:"Primary goal is to protect enterprise and its ability to perform its mission."},
        {q:"Which of the following reviews will provide the MOST insight into an enterprise's risk management capabilities?", opts:["A capability maturity model review","A capability comparison with industry standards or regulations","A self-assessment of capabilities","An internal audit review of capabilities"], correct:"A", justification:"Capability maturity modeling allows enterprise to understand its level of maturity in risk capabilities, indicator of operational readiness."},
        {q:"Which of the following BEST ensures the overall effectiveness of a risk management program?", opts:["Obtaining feedback from all end users","Assigning a dedicated risk manager to run the program","Applying quantitative risk methodologies","Gaining the participation of relevant stakeholders"], correct:"D", justification:"Stakeholders directly or indirectly determine risk response; without their participation, effectiveness cannot be guaranteed."},
        {q:"The PRIMARY focus of managing IT-related business risk is to protect:", opts:["information.","hardware.","applications.","databases."], correct:"A", justification:"Primary objective for any enterprise is to protect mission-critical information based on risk assessment."},
        {q:"Who is accountable for business risk related to IT?", opts:["Chief information officer","Chief financial officer","Users of IT services","Chief architect"], correct:"C", justification:"The enterprise (users of IT services) owns business-related risk, including risk related to use of IT."},
        {q:"Who is accountable for the overall enterprise strategy for risk governance?", opts:["Senior management","Business unit management","Chief risk officer","Board of directors"], correct:"D", justification:"The board of directors is accountable for overall enterprise risk governance strategy."},
        {q:"An enterprise is hiring a consultant to help determine the maturity level of the risk management program. The MOST important element of the request for proposal is the:", opts:["sample deliverable.","past experience of the engagement team.","methodology used in the assessment.","references from other enterprises."], correct:"C", justification:"Methodology illustrates consultant's process and offers basis to align expectations with execution of assessment."},
        {q:"An enterprise is expanding into new nearby domestic locations (office park). Which of the following is MOST important for a risk practitioner to report on?", opts:["Competitor analysis","Legal and regulatory requirements","Political issues","Potential of natural disasters"], correct:"B", justification:"Legal and regulatory requirements most likely change when moving to nearby location as each municipality may enforce different regulations."},
        {q:"An enterprise has outsourced personnel data processing to a supplier, and a regulatory violation occurs during processing. Who will be held legally responsible?", opts:["The supplier, because it has the operational responsibility","The enterprise, because it owns the data","The enterprise and the supplier","The supplier, because it did not comply with the contract"], correct:"B", justification:"Enterprise retains responsibility for management of and adherence to policies, procedures and regulatory requirements."},
        {q:"Which of the following should be of MOST concern to a risk practitioner?", opts:["Failure to notify the public of an intrusion","Failure to notify the police of an attempted intrusion","Failure to internally report a successful attack","Failure to examine access rights periodically"], correct:"C", justification:"Failure to report a successful intrusion is serious concern and could be interpreted as abetting."},
        {q:"What is the MOST effective method to evaluate the potential impact of legal, regulatory and contractual requirements on business objectives?", opts:["A compliance-oriented gap analysis","Interviews with business process stakeholders","A mapping of compliance requirements to policies and procedures","A compliance-oriented business impact analysis"], correct:"D", justification:"Compliance-oriented BIA will identify compliance requirements and assess their effect on business objectives and activities."},
        {q:"Shortly after performing the annual review and revision of corporate policies, a risk practitioner becomes aware that a new law may affect security requirements for the human resources system. The risk practitioner should:", opts:["analyze what systems and technology-related processes may be impacted.","ensure necessary adjustments are implemented during the next review cycle.","initiate an ad hoc revision of the corporate policy.","notify the system custodian to implement changes."], correct:"A", justification:"Assessing what systems may be impacted is best course; analysis must determine whether existing controls already address requirements."},
        {q:"When requesting information to comply with e-discovery, an enterprise learned that its cloud email provider was never contracted to back up messages, even though the company's email retention policy explicitly stated that all email must be saved for three years. Which of the following would have BEST safeguarded the company from this outcome?", opts:["Providing the contractor with the record retention policy up front","Validating the company policies to the provider's contract","Providing the contractor with the email retention policy up front","Backing up the data on the company's internal network nightly"], correct:"B", justification:"Initial review of third-party services should confirm that vendors are contractually required to enforce all internal policies."},
        {q:"A new data protection regulation directly affects an enterprise. What information should the risk practitioner gather to BEST ensure compliance?", opts:["List of controls that must be implemented to achieve and maintain compliance","Gaps associated with existing controls and control owners","Risk scenarios with a potential impact on compliance","The enterprise's risk appetite"], correct:"C", justification:"Risk scenarios should indicate potential effects of noncompliance and guide management in evaluating whether cost of compliance outweighs cost of noncompliance."},
        {q:"Which of the following would be the BEST approach for a global enterprise that is subject to regulation by multiple governmental jurisdictions with differing requirements?", opts:["Bringing all locations into conformity with aggregate requirements of all jurisdictions","Bringing all locations into conformity with generally accepted industry good practices","Establishing a baseline standard incorporating requirements all jurisdictions have in common","Establishing baseline standards for all locations and add supplemental standards as required"], correct:"D", justification:"More efficient to establish baseline standard and develop additional standards for locations that must meet specific requirements."},
        {q:"An enterprise has outsourced the majority of its IT department to a third party whose servers are in a foreign country. Which of the following is the MOST critical security consideration?", opts:["A security breach notification may get delayed due to time difference.","Additional network intrusion detection sensors should be installed, resulting in additional cost.","The enterprise could be unable to monitor compliance with its internal security and privacy guidelines.","Laws and regulations of the country of origin may not be enforceable in the foreign country."], correct:"D", justification:"Laws of country of origin may not be enforceable in foreign country; local laws of foreign vendor may also affect enterprise."},
        {q:"Which of the following documents BEST identifies an enterprise's compliance risk and the corrective actions in progress to meet these regulatory requirements?", opts:["An internal audit report","A risk register","An external audit report","A risk assessment report"], correct:"B", justification:"Risk register provides report of all current identified risk (including compliance risk) and tracks status of corrective actions or exceptions."},
        {q:"A new regulation for safeguarding information processed by a specific type of transaction has come to the attention of an IT manager. The manager should FIRST:", opts:["meet with stakeholders to decide how to comply.","analyze the key risk in the compliance process.","update the existing security/privacy policy.","assess whether existing controls meet the regulation."], correct:"D", justification:"First step is to understand impact and requirements of new regulation, including assessing how enterprise will comply and to what extent existing controls support compliance."},
        {q:"An enterprise expanded its operations into Europe, Asia and Latin America. The enterprise has a single-version, multiple-language employee handbook that was last updated three years ago. Which of the following is of MOST concern?", opts:["The handbook may not have been correctly translated into all languages.","Newer policies may not be included in the handbook.","Expired policies may be included in the handbook.","The handbook may violate local laws and regulations."], correct:"D", justification:"Because customs and laws affect ability to operate, it is critical for employee handbook to acknowledge and account for regional domestic and national differences."},
        {q:"Which of the following is the BIGGEST concern for a chief information security officer regarding interconnections with systems outside the enterprise?", opts:["Requirements to comply with each other's contractual security obligations","Uncertainty that the other system will be available as needed","The ability to perform risk assessments on the other system","Ensuring that communications between the two systems are encrypted through a virtual private network tunnel"], correct:"A", justification:"Ensuring both systems comply with mutual contractual security obligations should be primary concern."},
        {q:"A key objective when monitoring information systems control effectiveness against the enterprise's external requirements is to:", opts:["design the applicable information security controls for external audits.","create the enterprise's information security policy provisions for third parties.","ensure that the enterprise's legal obligations have been satisfied.","identify those legal obligations that apply to the enterprise's security practices."], correct:"C", justification:"Legal obligations are one of principal external requirements that necessitate compliance monitoring."},
        {q:"Which of the following approaches to corporate policy BEST supports an enterprise's expansion to other regions, where different local laws apply?", opts:["A global policy without provisions that might be disputed at local levels","A global policy amended to comply with local laws","A global policy that complies with laws at enterprise headquarters","Local policies to accommodate laws within each region"], correct:"B", justification:"Global policy including local amendments ensures alignment with local laws and regulations."},
        {q:"When data are no longer needed by a particular process, they should be:", opts:["encrypted and archived.","handled according to policy.","handled according to law.","destroyed in a secure manner."], correct:"B", justification:"How data are handled depends on business requirements as defined in data management policy."},
        {q:"Which of the following activities should a risk professional perform to determine whether firewall deployments are deviating from the enterprise's information security policy?", opts:["Review the firewall parameter settings.","Review the firewall intrusion prevention system logs.","Review the firewall hardening procedures.","Analyze the firewall log file for recent attacks."], correct:"A", justification:"Firewall parameter settings will tie in with configurations linked to governing security policy. If settings differ, then deviation exists."},
        {q:"If an enterprise does not have a formal policy in place regarding personal devices in the workplace, which of the following should the risk practitioner recommend?", opts:["Introduce remote wipe functionality for personal devices used in workplace.","Implement an exception process based on appropriate approvals.","Update incident response procedures covering personal devices.","Create and maintain an inventory of personal devices in use."], correct:"B", justification:"If employees allowed to attach personal devices but no formal policy, employees should gain management approval documented and reviewed in security exception form."},
        {q:"Which of the following MOST enables risk-aware business decisions?", opts:["Robust information security policies","Exchange of accurate and timely information","Skilled risk management personnel","Effective process controls"], correct:"B", justification:"Robust exchange of information enables management to optimize risk-related decisions. Accuracy and timeliness are critical success factors."},
        {q:"Development of corporate information security policy should PRIMARILY be based on:", opts:["vulnerabilities.","threats.","assets.","impacts."], correct:"C", justification:"Corporate information security policy is based on management's commitment to protect assets of enterprise from threats, risk and exposures."},
        {q:"An enterprise recently implemented a corporate bring your own device (BYOD) policy to reduce the risk of data leakage. Which of the following approaches MOST enables the policy to be effective?", opts:["Obtaining signed acceptance from users on the BYOD policy","Educating users on acceptable and unacceptable practices","Requiring users to read the BYOD policy and any future updates","Clearly stating disciplinary action for noncompliance"], correct:"B", justification:"BYOD policy approved and communicated will not be effective without proper training of all users."},
        {q:"Which of the following would be the MOST influential in determining an enterprise's approach to risk management?", opts:["Recent audit report findings","Chief information security officer approval","Key performance indicators","Enterprise policies"], correct:"D", justification:"Enterprise policies state guidance for risk management."},
        {q:"An enterprise security policy is an example of which control?", opts:["Operational control","Management control","Technical control","Corrective control"], correct:"B", justification:"Enterprise security policies are nontechnical management controls."},
        {q:"An enterprise risk assessment reveals that many corporate IT standards have not been updated. The BEST course of action is to:", opts:["review the standards against current requirements and determine their adequacy.","determine that the standards should be updated annually.","report that IT standards are adequate and do not need to be updated.","review the IT policy document and see how frequently IT standards should be updated."], correct:"A", justification:"Risk practitioner should verify that standards are still adequate; lacking standards should be updated."},
        {q:"The board of directors of a one-year-old start-up company asked their chief information officer (CIO) to create all the enterprise's IT policies and procedures. Which of the following should the CIO create FIRST?", opts:["The strategic IT plan","The data classification scheme","The information architecture document","The technology infrastructure plan"], correct:"A", justification:"Strategic IT plan is first policy to create when developing enterprise's governance model."},
        {q:"Information security procedures should:", opts:["be updated frequently as new software is released.","underline the importance of security governance.","define the allowable limits of behavior.","describe security baselines for each platform."], correct:"A", justification:"Security procedures must change frequently to keep up with changes in software."},
        {q:"Which of the following is the GREATEST risk of a policy that defines data and system ownership inadequately?", opts:["Audit recommendations may not be implemented.","Users may have unauthorized access to create, modify or delete data.","User management coordination does not exist.","Specific user accountability cannot be established."], correct:"B", justification:"Without policy defining who grants access, risk that employees receive system access without justified business purpose increases."},
        {q:"Who MUST give final sign-off on the IT risk management plan?", opts:["IT auditors performing the risk assessment","Business process owners","Senior managers","IT security administrators"], correct:"C", justification:"Senior managers have final responsibility for risk associated with audit findings and recommendations."},
        {q:"The board of directors of a one-year-old start-up company has asked the chief information officer to create the enterprise's IT policies and procedures, which will be managed and approved by the IT steering committee. The committee will make IT decisions for enterprise, including technology budget. The IT steering committee will be BEST represented by:", opts:["members of the executive board.","high-level members of the IT department.","IT experts from outside the enterprise.","key members from each department."], correct:"D", justification:"IT steering committee should be comprised of individuals from each department to ensure entire enterprise is represented."},
        {q:"Which of the following causes the GREATEST concern to a risk practitioner reviewing a corporate information security policy that is out of date? The policy:", opts:["was not reviewed within the last three years.","is missing newer technologies/platforms.","was not updated to account for new locations.","does not enforce control monitoring."], correct:"A", justification:"Not reviewing policy for three years and updating as necessary does not follow good practices and is greatest concern."},
        {q:"Which of the following groups would be the MOST effective in managing and executing an enterprise's risk program?", opts:["Mid-level managers","Senior managers","Frontline employees","The incident response team"], correct:"A", justification:"Mid-level managers are best to manage and execute risk program as they are most centrally located within organizational hierarchy."},
        {q:"The marketing department procures a third-party application for global enterprise use. During assessment, it is discovered that it poses risk to data privacy regulations within certain regions. If implemented globally, which role will be responsible for the risk it poses?", opts:["The marketing department","The IT department","The data privacy officer","The chief risk officer"], correct:"B", justification:"IT department is responsible; IT has policy that no tool/application can be implemented without risk assessment and mitigation."},
        {q:"The aggregated results of continuous monitoring activities are BEST communicated to:", opts:["the risk owner.","technical staff.","the audit department.","the information security manager."], correct:"A", justification:"Risk owner is most suitable target audience; risk owner is accountable for appropriate risk responses executed in alignment with risk appetite."},

    const fullQAData = [...qaData];
    const totalQuestions = fullQAData.length;

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let quizCompleted = false;

    const letters = ['A', 'B', 'C', 'D'];

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderQuestion() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        if (quizCompleted) {
            showFinalResult();
            return;
        }

        answered = false;
        nextBtn.disabled = true;
        nextBtn.textContent = 'Next →';
        nextBtn.className = 'next-btn';

        const qa = fullQAData[currentQuestionIndex];

        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
        scoreText.textContent = `Score: ${score}`;
        progressFill.style.width = `${((currentQuestionIndex) / totalQuestions) * 100}%`;

        const optionsHtml = qa.opts.map((opt, i) => `
            <li class="option-item" data-answer="${letters[i]}">
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${escapeHtml(opt)}</span>
                <span class="option-status"></span>
            </li>
        `).join('');

        container.innerHTML = `
            <div class="question-block">
                <div class="q-meta">Q${currentQuestionIndex + 1}</div>
                <div class="question-text">${escapeHtml(qa.q)}</div>
                <ul class="options-list">${optionsHtml}</ul>
                <div id="answerBox" style="display:none;">
                    <div class="answer-result" id="answerResult"></div>
                    <div class="explanation-box">
                        <div class="explanation-title">📖 EXPLANATION</div>
                        <div class="explanation-text">${escapeHtml(qa.justification)}</div>
                    </div>
                </div>
            </div>
        `;

        document.querySelectorAll('.option-item').forEach(option => {
            option.addEventListener('click', function() {
                selectAnswer(this);
            });
        });
    }

    function selectAnswer(selectedOption) {
        if (answered) return;

        answered = true;

        const selectedAnswer = selectedOption.getAttribute('data-answer');
        const qa = fullQAData[currentQuestionIndex];
        const correctAnswer = qa.correct;

        const answerBox = document.getElementById('answerBox');
        const answerResult = document.getElementById('answerResult');
        const nextBtn = document.getElementById('nextBtn');

        if (selectedAnswer === correctAnswer) {
            score++;
            selectedOption.classList.add('selected-correct');
            answerResult.className = 'answer-result correct';
            answerResult.textContent = `✓ Correct! Answer is: ${correctAnswer}`;
        } else {
            selectedOption.classList.add('selected-wrong');
            answerResult.className = 'answer-result wrong';
            answerResult.textContent = `✗ Wrong. Correct Answer is: ${correctAnswer}`;
            
            document.querySelectorAll('.option-item').forEach(option => {
                if (option.getAttribute('data-answer') === correctAnswer) {
                    option.classList.add('correct-answer');
                }
            });
        }

        document.getElementById('scoreText').textContent = `Score: ${score}`;
        answerBox.style.display = 'block';
        nextBtn.disabled = false;

        // Add disabled class to all options
        document.querySelectorAll('.option-item').forEach(opt => {
            opt.classList.add('disabled');
        });

        if (currentQuestionIndex === totalQuestions - 1) {
            nextBtn.textContent = 'Finish Quiz';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < totalQuestions - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            quizCompleted = true;
            renderQuestion();
        }
    }

        let resultMessage = '';

        } else if (percentage >= 75) {
            emoji = '👏';
            resultMessage = 'Good result. Review the incorrect answers to strengthen your knowledge.';
        } else if (percentage >= 60) {
            emoji = '📚';
            resultMessage = 'Fair result. More revision is recommended. Focus on the areas you missed.';
        } else {
            emoji = '💪';
            resultMessage = 'Needs improvement. Please review the full question set again and retry.';
        }

        container.innerHTML = `
            <div class="final-result">
                <h2>${emoji} Quiz Completed!</h2>
                <div class="final-score">${score} / ${totalQuestions}</div>
                <p><strong>Percentage:</strong> ${percentage}%</p>
                <p>${resultMessage}</p>
            </div>
        `;

        nextBtn.style.display = 'none';
        restartBtn.style.display = 'inline-block';
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        quizCompleted = false;

        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        nextBtn.style.display = 'inline-block';
        nextBtn.textContent = 'Next →';
        nextBtn.className = 'next-btn';
        restartBtn.style.display = 'none';

        renderQuestion();
    }

    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        renderQuestion();
    });
</script>
</body>
</html>
