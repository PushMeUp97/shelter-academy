            transition: 0.2s;

        .final-result {
            text-align: center;
            padding: 2rem;
            background: #f9fbfd;
            border-radius: 18px;
        }

        }

<script>
    // Complete dataset for Risk & Security (140 questions)
    const fullQAData = [
        {q:"Who grants formal authorization for user access to a protected file?", opts:["The process owner","The system administrator","The data owner","The security manager"], correct:"C", justification:"The data owner grants formal authorization for users to access protected files."},
        {q:"Which of the following roles provides formal authorization of user access?", opts:["Database administrator","Data owner","Process owner","Data custodian"], correct:"B", justification:"The data owner provides formal authorization to grant user access."},
        {q:"Which of the following concepts of data validation is MOST likely to be of value to enterprises reviewing transaction data for fraudulent activity?", opts:["Reliability","Duplicates","Reasonableness","Validity"], correct:"C", justification:"Reasonableness identifies values substantially different from the norm and routes them for additional scrutiny."},
        {q:"The PRIMARY concern of a risk practitioner reviewing a formal data retention policy is:", opts:["storage availability.","applicable organizational standards.","generally accepted industry good practices.","regulatory and business requirements."], correct:"D", justification:"Regulatory requirements are of primary importance, along with business requirements."},
        {q:"The IT department wants to use a server for an enterprise database, but the hardware is not certified by its manufacturer for the intended operating system or database software. A risk practitioner determines that introducing the hardware presents:", opts:["a minimal level of risk.","an unknown level of risk.","a medium level of risk.","a high level of risk."], correct:"B", justification:"Because the hardware is not certified, the risk is unknown."},
        {q:"Which of the following would data owners be PRIMARILY responsible for?", opts:["Intrusion detection","Antivirus controls","User entitlement changes.","Platform security"], correct:"C", justification:"Data owners are responsible for assigning user entitlement changes and approving access."},
        {q:"Information that is no longer required to support the main purpose of the enterprise from an information security perspective should be managed:", opts:["under the retention policy.","under the information classification policy.","under the backup policy.","under the business impact analysis."], correct:"A", justification:"Information no longer required should be analyzed under the retention policy."},
        {q:"An enterprise is applying controls to protect its product price list from being exposed to unauthorized staff. These internal controls will include:", opts:["identification and authentication.","authentication and authorization.","segregation of duties and authorization.","availability and confidentiality."], correct:"B", justification:"Authentication and authorization ensure confidentiality of the price list."},
        {q:"Which of the following is the MOST effective measure against insider threats to confidential information?", opts:["Audit trail monitoring","A privacy policy","Role-based access control","Defense in depth"], correct:"C", justification:"Role-based access control reduces unnecessary access rights and enforces accountability."},
        {q:"Which of the following BEST protects the confidentiality of data being transmitted over a network?", opts:["Data are encapsulated in data packets with authentication headers.","A digital hash is appended to all messages sent over the network.","Network devices are hardened in compliance with corporate standards.","Fiber-optic cables are used instead of copper cables."], correct:"A", justification:"Encapsulation with authentication headers protects confidentiality even during interception."},
        {q:"Strong authentication is BEST described as:", opts:["an authentication technique formally approved by a standardization body.","the simultaneous use of several authentication techniques.","an authentication system that makes use of cryptography.","an authentication system that uses biometric data to identify a person."], correct:"B", justification:"Strong authentication requires more than one type of authentication method."},
        {q:"Which of the following BEST provides message integrity, authentication of sender's identity and nonrepudiation?", opts:["Symmetric encryption","Message hashing","Message authentication code","Digital signatures"], correct:"D", justification:"A digital signature provides integrity, identity verification, and nonrepudiation."},
        {q:"Which of the following is the BEST control for securing data on mobile universal serial bus (USB) drives?", opts:["Requiring authentication when using USB devices","Prohibiting employees from copying data to USB devices","Encrypting USB devices","Limiting the use of USB devices"], correct:"C", justification:"Encryption provides the most effective protection of data on mobile devices."},
        {q:"The BEST method for detecting and monitoring a hacker's activities without exposing information assets to unnecessary risk is to use:", opts:["firewalls.","bastion hosts.","honeypots.","screened subnets."], correct:"C", justification:"Honeypots divert hackers from critical files and alert security."},
        {q:"Which of the following is MOST useful in managing increasingly complex deployments?", opts:["Policy development","A security architecture","Senior management support","A standards-based approach"], correct:"B", justification:"A security architecture provides overview and relationships to manage complex deployments."},
        {q:"Which of the following is the MOST appropriate metric to measure how well the information security function is managing the administration of user access?", opts:["Elapsed time to suspend accounts of terminated users","Elapsed time to suspend accounts of users transferring","Ratio of actual accounts to actual end users","Percent of accounts with configurations in compliance"], correct:"D", justification:"Percentage of compliant accounts shows overall impact of administration."},
        {q:"Which of the following is the MOST important requirement for setting up an information security infrastructure for a new system?", opts:["Performing a business impact analysis","Considering personal devices as part of the security policy","Basing the information security infrastructure on a risk assessment","Initiating an IT security awareness campaign, training and familiarization"], correct:"C", justification:"The information security infrastructure should be based on a risk assessment."},
        {q:"Which of the following is the MOST critical observation when system configuration files for a critical enterprise application system are being reviewed?", opts:["Configuration files are frequently changed.","Changes to configuration files are recorded.","Access to configuration files is not restricted.","Configuration values do not impact system efficiency."], correct:"C", justification:"If access is not restricted, overall system security is compromised."},
        {q:"Which of the following is the MAIN concern when two or more staff members are allowed to use the same generic account?", opts:["Segregation of duties","Inability to change the password","Repudiation","Inability to trace account activities"], correct:"C", justification:"Repudiation is the main concern because individual accountability is lost."},
        {q:"A third party is engaged to develop a business application. Which of the following BEST ensures detection of back doors?", opts:["Security code reviews for the entire application","System monitoring for traffic on network ports","Reverse engineering the application binaries","Running the application from a high-privileged account on a test system"], correct:"A", justification:"Security code reviews examine source code comprehensively to detect back doors."},
        {q:"When configuring a biometric access control system that protects a high-security data center, the system's sensitivity level should be set to:", opts:["a lower equal error rate.","a higher false acceptance rate.","a higher false reject rate.","the crossover error rate exactly."], correct:"C", justification:"For high security, minimize false accepts even if false rejects increase."},
        {q:"Which of the following environments typically represents the GREATEST risk to organizational security?", opts:["An enterprise data warehouse","A load-balanced, web server cluster","A centrally managed data switch","A locally managed file server"], correct:"D", justification:"Locally managed file servers are subject to less oversight and inconsistent enforcement."},
        {q:"An enterprise's corporate policy specifies that servers log only access requests, including whether the request fails or succeeds. What is the PRIMARY risk to the enterprise?", opts:["The source Internet Protocol (IP) address is not logged.","The destination IP address is not logged.","Login information can be lost if the data are not automatically moved to secondary storage.","The details of what commands were executed is missing."], correct:"D", justification:"Logs need to record executed commands for forensic tracking, not just login statistics."},
        {q:"The PRIMARY purpose of providing built-in audit trails in applications is to:", opts:["support e-discovery.","collect information for auditors.","enable troubleshooting.","establish accountability."], correct:"D", justification:"Audit trails establish accountability of who did what and when."},
        {q:"Which of the following will BEST prevent external security attacks?", opts:["Securing and analyzing system access logs","Network address translation","Background checks for temporary employees","Static Internet Protocol addressing"], correct:"B", justification:"Network address translation makes internal addresses non-routable, preventing external attacks."},
        {q:"The person responsible for ensuring that information is classified is the:", opts:["security manager.","technology group.","data owner.","senior management."], correct:"C", justification:"The data owner is responsible for applying proper classification to data."},
        {q:"Security administration efforts are BEST reduced through the deployment of:", opts:["access control lists.","discretionary access controls.","mandatory access controls.","role-based access controls."], correct:"D", justification:"Role-based access controls reduce administration effort when individuals change positions."},
        {q:"Which of the following is the BEST metric to manage the information security program?", opts:["The number of systems that are subject to intrusion detection","The amount of downtime caused by security incidents","The time lag between detection, reporting and acting on security incidents","The number of recorded exceptions from the minimum information security requirements"], correct:"D", justification:"Exceptions from set requirements directly correlate to the quality of the security program."},
        {q:"Malware has been detected that redirects users' computers to websites crafted specifically for the purpose of fraud. This scenario BEST describes a:", opts:["man-in-the-middle attack.","phishing attack.","pharming attack.","social engineering attack."], correct:"C", justification:"Pharming changes DNS server pointers to redirect users to fraudulent websites."},
        {q:"An enterprise recently developed a breakthrough technology that could provide a significant competitive edge. Which of the following FIRST governs how this information is to be protected from within the enterprise?", opts:["The data classification policy","The acceptable use policy","Encryption standards","The access control policy"], correct:"A", justification:"The data classification policy describes categories and level of protection."},
        {q:"The MOST important task in system control verification is:", opts:["monitoring password resets.","detecting malware.","managing alerts.","performing log reviews."], correct:"C", justification:"Managing response time to critical alerts is most important."},
        {q:"IT plans to replace its existing wired local area network with a wireless infrastructure to accommodate the use of mobile devices. This will increase the risk of which of the following attacks?", opts:["Wardriving","Port scanning","Malware on mobile devices","Spoofing attacks"], correct:"A", justification:"Wireless infrastructure is specifically subject to wardriving attacks."},
        {q:"What is the purpose of system accreditation?", opts:["To ensure that risk associated with implementation has been identified and explicitly accepted by a senior manager","To review all technical and nontechnical controls to ensure that the security risk has been reduced to acceptable levels","To ensure that changes to the security controls are properly authorized, tested and documented","To require the training and certification of staff that will be responsible for working on a system"], correct:"A", justification:"Accreditation is the decision by senior management to accept risk and implement a system."},
        {q:"Which of the following threat sources is the MOST difficult to detect?", opts:["Viruses","Bots","Rootkits","Worms"], correct:"C", justification:"Rootkits are designed to be stealthy, making them most difficult to detect."},
        {q:"Which of the following principles of information security is of the GREATEST concern to a social media outlet for political or news-related content?", opts:["Integrity","Confidentiality","Availability","Nonrepudiation"], correct:"C", justification:"Availability is the greatest concern for social media outlets."},
        {q:"Which of the following vulnerabilities will make a web application MOST susceptible to a structured query language (SQL) injection attack?", opts:["Insecure cryptographic storage","Weak session identifiers","Fail-open error handling","Inadequate validation of input"], correct:"D", justification:"SQL injection occurs through input fields that do not validate properly."},
        {q:"Which of the following is the MOST significant risk associated with handling credit card data through a web application?", opts:["Static Internet Protocol addressing does little to prevent an attack.","Allowing the transmission of credit card data over the Internet using a secure channel.","Failure to store credit card data in a secure area segregated from the demilitarized zone.","Installation of network devices with default access settings disabled or inoperable."], correct:"C", justification:"Failure to segregate credit card data from the DMZ is a common serious flaw."},
        {q:"After a laptop has been identified as lost or stolen, which of the following BEST mitigates the risk of unauthorized access to the information on the device?", opts:["Remote wipe capabilities","Encryption","Data classification policy","Application download restrictions"], correct:"B", justification:"Encryption best protects confidentiality and integrity of information on lost devices."},
        {q:"How does an enterprise BEST ensure that developers do not have access to implement changes to production applications?", opts:["The enterprise must ensure that development staff does not have access to executable code.","The enterprise must have segregation of duties between application development and operations.","The enterprise system development life cycle must be enforced to require segregation of duties.","The enterprise's change management process must be enforced for all but emergency changes."], correct:"B", justification:"Segregation of duties ensures developers cannot move changes into production."},
        {q:"The PRIMARY goal of certifying a system prior to implementation is to:", opts:["protect the enterprise from liability for releasing a substandard system.","review the system controls to ensure that the controls are configured correctly.","test the integrated system to detect any upstream or downstream liabilities.","ensure that the system meets its specified security requirements at the time of testing."], correct:"D", justification:"Certification ensures the system meets agreed-upon security requirements."},
        {q:"Which automated monitoring technique in an application uses triggers to indicate a suspicious condition?", opts:["Snapshots","An integrated test facility","Audit hooks","Continuous and intermittent simulation"], correct:"C", justification:"Audit hooks are embedded triggers that activate when certain conditions are met."},
        {q:"What is the MOST important factor in the success of an ongoing information security monitoring program?", opts:["Logs that capture all network and application traffic for later analysis","Staff who are qualified and trained to execute their responsibilities","System components all have up-to-date patches","A security incident and event management system is in place"], correct:"B", justification:"Qualified staff are critical; tools are only as good as the staff managing them."},
        {q:"Which of the following data security controls BEST protects the confidentiality of data stored on backup media in transit to a third-party storage facility?", opts:["Hash totals","Bonded couriers","Tamper-resistant packaging","Encryption"], correct:"D", justification:"Encryption prevents access to data even if media is intercepted."},
        {q:"The identification of Internet Protocol (IP) addresses is a form of which type of authentication?", opts:["Knowledge","Ownership","Node","Characteristic"], correct:"C", justification:"Node authentication applies to a device or location via IP address."},
        {q:"The purpose of system certification is to demonstrate that:", opts:["security plans are created and aligned with organizational objectives.","risk assessments are performed according to established test plans.","approval to operate the system is provided by the business owner.","security controls and processes are assessed for effectiveness."], correct:"D", justification:"Certification assesses security controls and processes for effectiveness."},
        {q:"What control focuses directly on preventing the risk of collusion?", opts:["Mandatory access control","Principle of least privilege","Discretionary access control","Mandatory job rotation"], correct:"D", justification:"Job rotation reduces opportunities for collusion by changing responsibilities."},
        {q:"Which of the following information system control practices would be MOST effective against internal threats to confidential information stored within an application?", opts:["Strong data encryption","Role-based access control","Digital certificate-based access","Signed confidentiality agreements"], correct:"B", justification:"Role-based access control ensures internal staff cannot access non-relevant information."},
        {q:"There is an increase in help desk call levels because the vendor hosting the HR self-service portal has reduced password expiration from 90 to 30 days. The corporate password policy requires 60 days. The risk practitioner should FIRST:", opts:["formally investigate the cause of the unauthorized change.","request the service provider reverse the password expiration period to 90 days.","initiate a request to strengthen the corporate password expiration requirement to 30 days.","notify employees of the change in password expiration period."], correct:"A", justification:"Unauthorized changes by an external vendor represent a key risk that must be investigated first."},
        {q:"Which of the following attacks occurs PRIMARILY because user input is not properly validated?", opts:["Uniform resource locator obfuscation","Directory traversal","Cross-site scripting","Session hijacking"], correct:"C", justification:"Cross-site scripting results from insufficient input validation allowing malicious scripts."},
        {q:"Which control would a risk practitioner recommend to mitigate the risk that personnel who can change system configuration settings can also modify computer operational logs?", opts:["Segregation of duties","Authentication","Authorization","Shift rotation"], correct:"A", justification:"Segregation of duties separates configuration change authorization from log modification ability."},
        {q:"A financial institution conducts high-value electronic transactions with customers using their self-signed digital certificates. Which would be of MOST concern to the risk practitioner?", opts:["Customers' self-signed certificates may not be accepted by an internal user's browser.","Nonrepudiation requirements may not be enforced by these certificates.","The certificate's private key may be susceptible to a malicious attack.","Self-signed certificates may lead to session hijacking due to unencrypted traffic."], correct:"B", justification:"Nonrepudiation requires third-party trusted certificates, not self-signed."},
        {q:"What is the PRIMARY reason that an enterprise would establish segregation of duties controls?", opts:["To restrict users to the minimum level of access required to perform their jobs","To ensure that any sensitive financial transactions cannot violate corporate policy","To restrict users to working on systems that reflect their areas of expertise","To prevent errors or fraudulent activity on high-risk transactions"], correct:"D", justification:"Segregation of duties makes fraudulent activities require collusion, decreasing likelihood."},
        {q:"Which of the following activities is the MOST important related to testing the IT continuity plan?", opts:["A test based on defined recovery priorities","A test limited to the recovery of IT infrastructure","A test that can be performed at any time","Roundtable exercises, if testing is not feasible"], correct:"A", justification:"Continuity tests should be based on recovery priorities from the business impact analysis."},
        {q:"Which factor should be included when assessing the impact of losing network connectivity for 18 to 24 hours?", opts:["The hourly billing rate charged by the carrier","Financial losses incurred by affected business units","The value of the data transmitted over the network","An aggregate compensation of all affected business users"], correct:"B", justification:"The impact reflects cumulative financial losses incurred by the enterprise."},
        {q:"Which of the following BEST supports business continuity management in meeting external stakeholder expectations?", opts:["Prioritizing applications based on business criticality.","Ensuring that backup data are available for restoration.","Disclosing the crisis management strategy statement.","Obtaining risk assessment by an independent party."], correct:"A", justification:"Prioritizing applications based on business criticality meets external expectations optimally with limited resources."},
        {q:"Which statement related to business continuity plans represents the MOST significant threat to an enterprise?", opts:["Plans are kept on an externally hosted content management system.","Time lines are unrealistically long.","Plans are not up to date.","Resources are not in place."], correct:"C", justification:"Inaccurate plans give false assurance; not knowing plans are outdated is a significant threat."},
        {q:"Business continuity plans should be written and maintained by:", opts:["the information security and information technology functions.","representatives from all functional units.","the risk management function.","executive management."], correct:"B", justification:"Business continuity planning requires collaboration from all business owners."},
        {q:"The BEST way to address internal security threats is to have regular:", opts:["awareness training for all employees and third parties who have access to information.","background checks of all employees and third parties prior to information access.","alignment of organizational policies with regulatory requirements and changes.","monitoring and auditing of information access and changes."], correct:"A", justification:"Regular awareness training reduces the likelihood of internal threats materializing."},
        {q:"During a quarterly risk assessment, IT reports a heavy increase in malware attacks. What is the MOST appropriate recommendation?", opts:["Contract with a new anti-malware software vendor.","Close down the Internet connection.","Make the number of malware attacks part of each employee's performance metrics.","Increase employee awareness training, including end-user roles."], correct:"D", justification:"Employee awareness training helps avoid and detect malware attacks."},
        {q:"Which is the BEST indicator that incident response training is effective?", opts:["Decreased reporting of security incidents","Increased reporting of security incidents","Decreased number of password resets","Increased number of identified system vulnerabilities"], correct:"B", justification:"Increased reporting shows user awareness of security rules and reporting processes."},
        {q:"After a spear phishing breach despite a comprehensive awareness program, what is the MOST effective way to improve security awareness?", opts:["Review the program and improve coverage of social engineering.","Launch a disciplinary process against those who leaked information.","Perform periodic social engineering tests and communicate results.","Implement a data loss prevention system that points users to policies."], correct:"C", justification:"Periodic social engineering tests help maintain alertness that threats are real."},
        {q:"Which is of MOST concern to the risk practitioner regarding applications running in production?", opts:["Unpatched vulnerabilities","Backdoors","Unskilled resources","Informal system development life cycle"], correct:"B", justification:"Backdoors bypass authorized access control, posing immediate risk."},
        {q:"Which threat would MOST concern the risk practitioner? An enterprise allows:", opts:["Internet-facing applications for business functions.","third-party access through remote network connectivity.","employee-owned devices for business functions.","artificial intelligence systems for business functions."], correct:"C", justification:"Employee-owned devices increase risk of malware, information loss, and unauthorized access."},
        {q:"Which provides the GREATEST level of information security awareness?", opts:["Job descriptions","A security manual","Security training","An organizational diagram"], correct:"C", justification:"Security training is best to inform all employees about risk and responsibilities."},
        {q:"What is the MOST important reason for conducting security awareness programs?", opts:["Reducing the risk of social engineering attacks","Training personnel to respond to security incidents","Informing business units about the security strategy","Maintaining evidence of training records for compliance"], correct:"A", justification:"Awareness helps reduce social engineering attacks by sensitizing employees."},
        {q:"What is the BEST approach when conducting an IT risk awareness campaign?", opts:["Provide technical detail on exploits.","Provide common messages tailored for different groups.","Target system administrators and help desk staff.","Target senior managers and business process owners."], correct:"B", justification:"Groups differ; tailor common messages to each role and level of understanding."},
        {q:"Which resource has the GREATEST risk of failure while implementing any security solution?", opts:["Security hardware","Security staff","Security processes","Security software"], correct:"B", justification:"Staff represent greatest risk due to fraud or accidental misconfiguration."},
        {q:"What is MOST important for measuring effectiveness of a security awareness program?", opts:["Increased interest in focus groups","Reduced number of security violation reports","Quantitative evaluation to ensure comprehension","Increased number of security violation reports"], correct:"D", justification:"Increased violation reports by staff is best indicator of awareness."},
        {q:"An enterprise can earn client trust and confidence in information security by publishing:", opts:["its information security policies.","an external assurance certification.","its personally identifiable information handling policy.","the number of findings from the most recent audit."], correct:"B", justification:"External assurance certification provides independent view of risk and controls."},
        {q:"Which BEST demonstrates the enterprise's readiness for unexpected events?", opts:["Change management plan","Incident response plan","Communication plan","Disaster recovery plan"], correct:"B", justification:"The incident response plan indicates preparedness to handle unexpected events."},
        {q:"Which control practice includes establishing baselines for internally developed systems?", opts:["Release management","Configuration management","Change management","Asset management"], correct:"B", justification:"Establishing baselines falls under configuration management."},
        {q:"Data from which provides the BEST information for investigating the root cause of a security incident?", opts:["Intrusion detection system","Intrusion prevention system","Configuration management system","Event management system"], correct:"D", justification:"Event management merges logs from various systems for correlated analysis."},
        {q:"Prior to releasing an OS security patch into production, the MOST important practice is to have the patch:", opts:["applied simultaneously to all systems.","procured from an approved vendor.","tested in a preproduction test environment.","approved by business stakeholders."], correct:"C", justification:"Testing is essential because an untested patch may cause business disruptions."},
        {q:"Which cloud model presents the lowest risk for a travel booking system storing employee information?", opts:["Hybrid","Private","Public","Community"], correct:"B", justification:"Private cloud keeps data under control of the enterprise."},
        {q:"What is the BEST way to verify that critical production servers are using up-to-date antivirus signature files?", opts:["Check a sample of servers.","Verify the date signature files were last pushed out.","Use a benign virus to test quarantine.","Research the most recent signature file and compare to console."], correct:"A", justification:"The only effective way is to check a sample of servers directly."},
        {q:"During which phase of incident response will an attempt to limit the impact MOST likely be made?", opts:["Mitigation","Recovery","Response","Detection"], correct:"C", justification:"During the response phase, attempts are made to limit impact while the incident is ongoing."},
        {q:"A MAJOR risk of single sign-on is that it:", opts:["uses complex technologies for password management.","may potentially bypass the enterprise firewall.","is prone to distributed denial-of-service attacks.","may be a potential single point of compromise."], correct:"D", justification:"Loss or disclosure of SSO credentials compromises a broad range of systems."},
        {q:"An excessive number of standard workstation images can be a key risk indicator for:", opts:["change management.","configuration management.","IT operations management.","data management."], correct:"B", justification:"Excessive images indicate poor configuration management processes."},
        {q:"Criticality of an IT infrastructure element can be quantified based on:", opts:["audit logs.","thresholds.","dependencies.","replacement cost."], correct:"C", justification:"Criticality is measured by the number and type of dependencies on that element."},
        {q:"Which action will MOST likely occur during an incident response plan activation?", opts:["Enabling logging","Shutting down a server to patch defects","Implementing virus scanning for incoming email","Assisting migration to alphanumeric passwords"], correct:"B", justification:"Shutting down servers to patch defects is a corrective action during incident response."},
        {q:"What is the MOST financially damaging vulnerability associated with logging that captures only a few hardcoded transactions and recycles daily?", opts:["The log data recycles in less than 24 hours.","The log files are stored on originating servers.","Transactions required by regulation may not be tracked.","Transactions being logged are hardcoded."], correct:"C", justification:"The enterprise may be fined for failing to track regulation-required transactions."},
        {q:"Which technique BEST determines unauthorized program changes since last authorized update?", opts:["A test data run","An automated code comparison","A code review","A review of code migration procedures"], correct:"B", justification:"Automated code comparison efficiently compares two versions to detect changes."},
        {q:"What is the MOST important consideration when determining security measures for a critical information system?", opts:["The number of threats","The level of acceptable risk","The number of vulnerabilities","The available security budget"], correct:"B", justification:"Risk response is based on the difference between current risk and acceptable risk."},
        {q:"Which would BEST help an incident response team identify source of a malware attack to reduce recurrence?", opts:["Penetration test","Vulnerability scan","Phishing simulation","Root cause analysis"], correct:"D", justification:"Root cause analysis discovers the underlying issue to prevent recurrence."},
        {q:"Which is the MOST effective control to prevent segregation of duties violations?", opts:["Enabling IT audit trails","Implementing two-way authentication","Reporting access log violations","Implementing role-based access"], correct:"D", justification:"Role-based access is a preventive method that adjusts access according to user role."},
        {q:"What is the PRIMARY objective of a peer review prior to firewall configuration changes?", opts:["To assist in detecting fraudulent activity","To reduce need for technical testing","To facilitate knowledge transfer","To help detect errors prior to implementation"], correct:"D", justification:"Peer review highlights errors before changes are implemented into production."},
        {q:"Which risk consideration is of MOST concern regarding hardware as opposed to software?", opts:["Misconfiguration","Access control","Skilled resources","Version control"], correct:"A", justification:"Misconfiguration is a larger concern for hardware, potentially leaving the system open."},
        {q:"In a VPN review, which computer location is of MOST concern?", opts:["Enterprise's remote offices","Enterprise's internal network","Backup site","Employees' homes"], correct:"D", justification:"Home computers are least often subject to enterprise security policy, posing high risk."},
        {q:"Which provides the MOST valuable input to incident-response efforts?", opts:["Qualitative analysis of threats","Annual loss expectancy","Vulnerability assessment","Penetration testing"], correct:"A", justification:"Qualitative analysis reflects intuitive view of threat outcomes by consequence order."},
        {q:"The PRIMARY goal of a post-incident review is to:", opts:["gather evidence for legal action.","identify ways to improve the response process.","identify individuals who failed to act.","identify attackers."], correct:"B", justification:"Post-incident review evaluates and improves the incident response process."},
        {q:"Which information systems control is the BEST way to detect malware?", opts:["Reviewing changes to file size","Reviewing administrative-level changes","Reviewing audit logs","Reviewing incident logs"], correct:"A", justification:"Comparing current executables with historical sizes and timestamps detects malware."},
        {q:"The GREATEST benefit of periodic disaster recovery site exercises is to ensure:", opts:["continued suitability of contingency facilities.","continued availability of data from primary site.","correct equipment at contingency facilities.","security measures match primary site."], correct:"A", justification:"Suitability of the facility is most critical; otherwise the plan will fail."},
        {q:"Due to changes in IT environment, the DR plan has been modified. What is the GREATEST benefit of testing the new plan? To ensure that:", opts:["the plan is complete.","the team is trained.","all assets have been identified.","risk assessment was validated."], correct:"A", justification:"Testing ensures the plan is complete and will work during a crisis."},
        {q:"Which is the MOST important risk to consider when developing a disaster recovery plan?", opts:["Budgets not finalized","Business impact analysis not conducted","No risk strategy established","Employees not trained"], correct:"B", justification:"Without a BIA, the enterprise doesn't know what to recover and when."},
        {q:"Minimizing single points of failure from a widespread natural disaster can be controlled by:", opts:["redundant systems on site.","fireproof vaults.","preparing BCPs for anticipated disasters.","allocating resources geographically."], correct:"D", justification:"Geographic allocation mitigates risk of a common disaster affecting all resources."},
        {q:"Which is the MOST effective way to treat low-probability, high-impact risk like a natural disaster?", opts:["Eliminate the risk.","Accept the risk.","Transfer the risk.","Implement countermeasures."], correct:"C", justification:"Typically such risk is transferred to insurance companies."},
        {q:"Disabling database normalization controls to increase performance will MOST likely increase risk of:", opts:["loss of audit trails.","duplicate indexes.","data redundancy.","unauthorized access."], correct:"C", justification:"Normalization reduces redundant data; disabling it increases redundancy risk."},
        {q:"Which cloud deployment model offers the most safeguards for confidential information?", opts:["Public cloud","Private cloud","Community cloud","Hybrid cloud"], correct:"B", justification:"Private cloud operates solely for the enterprise with needed confidentiality controls."},
        {q:"Which BEST addresses information security risk associated with PII?", opts:["Virtual firewall system","Intrusion detection system","Intrusion prevention system","Data loss prevention system"], correct:"D", justification:"DLP proactively ensures users do not send sensitive information outside the network."},
        {q:"Which MOST indicates a customer data warehouse should remain in-house rather than outsourced offshore?", opts:["Higher telecommunications costs","Privacy laws may prevent cross-border flow","Time zone differences","More detailed specifications needed"], correct:"B", justification:"Privacy laws prohibiting cross-border PII flow may make offshore location impossible."},
        {q:"A healthcare practitioner is given the file of a different patient scheduled later. What is the PRIMARY type of risk?", opts:["Relevance","Integrity","Security","Availability"], correct:"A", justification:"Relevance risk is not getting the right information to the right person at the right time."},
        {q:"To validate data integrity during processing in multiple applications, which gives BEST assurance?", opts:["Input field size checking","Format checking","Special character checking","Range checking"], correct:"D", justification:"Range checking ensures declared values are in acceptable range, preventing erroneous results."},
        {q:"To determine protection level for PII, a risk practitioner should PRIMARILY consider:", opts:["source.","cost.","sensitivity.","validity."], correct:"C", justification:"Sensitivity of information takes precedence regarding protection of PII."},
        {q:"Which control BEST reduces residual risk from inadvertent disclosure of sensitive files on a laptop?", opts:["Backing up to a remote server","Encrypting a particular partition","Staff awareness training to identify and encrypt files","Copying encrypted files to a USB drive"], correct:"C", justification:"Awareness training helps staff identify and encrypt sensitive files, preventing disclosure."},
        {q:"Which helps enterprises weigh benefits of data processing against risk to determine response?", opts:["Privacy impact assessment","Process maturity assessment","Root cause analysis","Business impact analysis"], correct:"A", justification:"Privacy impact assessment analyzes potential privacy impacts within risk management framework."},
        {q:"How can an enterprise prevent duplicate processing of a transaction?", opts:["Encrypting the transaction","Comparing hash values of each transaction","Not allowing two identical transactions within a set time period","Not allowing more than one transaction per account per login"], correct:"C", justification:"The second identical transaction within a time period should trigger a notification."},
        {q:"Which provides the BEST safeguard against a data breach?", opts:["Data encryption","Security awareness training","Cyber-risk insurance","Data masking"], correct:"B", justification:"Awareness training helps employees ensure adequate protections for the data they handle."},
        {q:"What is MOST important when transmitting personal information across networks?", opts:["Encrypting the personal information.","Obtaining consent to transfer.","Ensuring the privacy of the personal information.","Ensuring effective change management."], correct:"C", justification:"Privacy protection ensures the receiving party has appropriate level of protection."},
        {q:"What is the MOST important consideration when developing a record retention policy?", opts:["Delete all unneeded data quickly.","Retain data only as long as necessary for business or regulatory requirements.","Keep data to ensure future availability.","Archive old data without encryption."], correct:"B", justification:"Data should be kept only as long as required by business or regulation."},
        {q:"Which BEST addresses the risk of data leakage?", opts:["Capacity planning procedures","File backup procedures","Acceptable use policies","Database integrity checks"], correct:"C", justification:"Acceptable use policies are important for preventing unauthorized disclosure."},
        {q:"Which would create the GREATEST benefit for an enterprise deploying new IT infrastructure processing personal data?", opts:["Privacy by design","Privacy notices","Data encryption","Data classification"], correct:"A", justification:"Privacy by design embeds privacy within the entire IT infrastructure life cycle."},
        {q:"The MAIN benefit of information classification is that it helps:", opts:["determine how information can be labeled.","establish access control matrices.","determine risk tolerance level.","select security measures proportional to risk."], correct:"D", justification:"Classification partitions information so proportional security measures can be designed."},
        {q:"The MOST important principle of data protection the risk practitioner should advocate for is:", opts:["Data should be retained for required time.","Data should be adequate for its purpose.","Data should be accurate.","Data should be encrypted in transit and at rest."], correct:"C", justification:"Without accurate information, all other options are irrelevant."},
        {q:"What is the FIRST step to implement controls to mitigate risk of noncompliance with privacy laws?", opts:["Data inventory and classification","Data encryption and hashing","Multi-factor authentication","Anonymization and tokenization"], correct:"A", justification:"Any control related to data protection must start with identifying and classifying assets."},
        {q:"Which system development life cycle stage is MOST suitable for incorporating internal controls?", opts:["Development","Testing","Implementation","Design"], correct:"D", justification:"Internal controls should be incorporated at the earliest stage possible, i.e., design."},
        {q:"A likelihood-impact matrix would MOST likely be used during software project evaluation to:", opts:["estimate compliance with critical path.","brainstorm resource shortage factors.","identify root causes of time delays.","qualitatively assess key risk within the project."], correct:"D", justification:"Likelihood-impact matrix provides qualitative risk assessment based on probability and impact."},
        {q:"Which changeover technique has the GREATEST risk regarding consistency of data when moving users?", opts:["Parallel","Outsourcing","Abrupt","Phased"], correct:"C", justification:"Abrupt changeover involves high risk of data loss and system failure without reversion."},
        {q:"In which phase should the process to amend deliverables be defined to prevent scope creep?", opts:["Feasibility","Development","User acceptance","Design"], correct:"A", justification:"During feasibility, process for amending deliverables and approving changes is defined."},
        {q:"Which is the MOST prevalent risk in the development of end-user computing applications?", opts:["Increased development and maintenance costs","Increased development time","Impaired decision-making due to reduced responsiveness","Failure to subject applications to testing and IT general controls"], correct:"D", justification:"End-user applications may lack standards, controls, quality assurance, and documentation."},
        {q:"Which risk should be addressed during application design?", opts:["Lack of skilled resources","Migration risk","Incomplete technical specifications","Third-party supplier risk"], correct:"A", justification:"Lack of skilled resources implies project is beyond team's skills, representing design phase risk."},
        {q:"During initial SDLC phase, which task MUST be accomplished before moving to system design?", opts:["Risk is accepted by management.","Test scenarios are documented.","Project budget increased for security.","Equipment procured to meet security requirements."], correct:"A", justification:"Management sign-off accepting risk is critical before proceeding further."},
        {q:"Which is used to determine whether unauthorized modifications were made to production programs?", opts:["Analytical review","Compliance testing","System log analysis","Forensic analysis"], correct:"B", justification:"Compliance testing verifies the change management process was applied consistently."},
        {q:"Risk assessments are MOST effective in software development when performed:", opts:["before system development begins.","during system deployment.","during each stage of the SDLC.","before developing a business case."], correct:"C", justification:"Performing risk assessments at each stage catches flaws as soon as they become discoverable."},
        {q:"During which phase are security features configured, enabled, tested and verified?", opts:["Implementation","Operation","Maintenance","Development"], correct:"A", justification:"Security features are configured and tested during implementation phase."},
        {q:"At which phase should risk related to system requirements be determined?", opts:["Development","Implementation","Initiation","Maintenance"], correct:"C", justification:"Upon initiation, identified risk should inform system security requirements."},
        {q:"Which is the MOST important critical success factor for a risk-based approach to SDLC?", opts:["Existence of a risk management framework","Defined risk mitigation strategies","Compliance with change management","Adequate involvement of business representatives"], correct:"D", justification:"Adequate involvement of business representatives is the most important CSF."},
        {q:"Which test BEST ensures an application is ready to be implemented?", opts:["Parallel test","Stress test","User acceptance test","Recovery test"], correct:"C", justification:"User acceptance test ensures adequate quality and that the system can satisfy user needs."},
        {q:"In which phase should a risk practitioner FIRST become involved?", opts:["Analysis","Design","Planning","Implementation"], correct:"C", justification:"Risk practitioner should be involved as early as planning to influence resources efficiently."},
        {q:"Which BEST identifies controls addressing risk related to cloud computing?", opts:["Data encryption, tenant isolation, controlled change management","Data encryption, customizing application template, importing widgets","Open standards, data encryption, tenant isolation","Tenant isolation, controlled change management, importing widgets"], correct:"A", justification:"Encryption, tenant isolation, and controlled change management address cloud data risk."},
        {q:"To identify gaps from unmanaged IT items in Shadow IT, compile a list of:", opts:["internally developed applications.","authorized supplier-managed applications.","applications managed by IT and business units.","enterprise cloud deployments."], correct:"C", justification:"Business-managed applications can be evaluated through security review to implement controls."},
        {q:"When evaluating IoT device risk, which should be addressed FIRST?", opts:["IoT devices with hard-coded passwords","IoT devices with no vendor support","IoT devices with passwords changing less than every 30 days","IoT devices connected to trusted network"], correct:"A", justification:"Hard-coded passwords are widely available defaults, making them easily exploitable."},
        {q:"During a BYOD risk assessment, the DBA uses social media on personal device before running a query of credit card numbers. Recommend:", opts:["develop and deploy an acceptable use policy.","place a virtualized desktop on each mobile device.","blacklist social media websites in the DMZ.","provide the DBA with user awareness training."], correct:"B", justification:"Virtualized desktop ensures no data stored on device; commands executed within enterprise DMZ."},
        {q:"Which is the MOST effective measure to protect data held on mobile computing devices?", opts:["Protection of data in transit","Encryption of stored data","Power-on passwords","Biometric access control"], correct:"B", justification:"Encryption ensures actual data cannot be recovered without the key."},
        {q:"A business case for risk mitigation in a complex application project should be retained until:", opts:["project approval.","user acceptance.","application deployment.","application's end of life."], correct:"D", justification:"All documentation should be retained until system is no longer in service."},
        {q:"Which poses the MOST significant threat to a project?", opts:["Lack of feedback upon completion","Lack of unit testing","Missed opportunities from lessons learned","Misunderstanding the requirements"], correct:"D", justification:"Misunderstood requirements can result in business failure even if internal criteria met."},
        {q:"Project-related risk threatening software project completion is BEST identified by the:", opts:["project manager.","project sponsor.","steering committee.","quality assurance team."], correct:"A", justification:"Project manager is responsible for identification, analysis, and monitoring of project risk."},
        {q:"Which project management tool is MOST appropriate for a project of uncertain duration?", opts:["Gantt chart","Work breakdown structure","Program evaluation review technique (PERT)","Histogram"], correct:"C", justification:"PERT uses optimistic, likely, and pessimistic estimates, better for uncertain duration."},
        {q:"During implementation, a relevant unidentified risk is discovered. What is the NEXT step?", opts:["Update risk treatment plan and report to management.","Penalize the project owner.","Add the risk to the risk register and analyze.","Refine the risk assessment methodology."], correct:"C", justification:"New risk must be added to risk register to ensure adequate analysis and tracking."},
        {q:"Which is MOST likely to result in a project going over budget?", opts:["Testing","Scope creep","Loss of sponsorship","Quality control"], correct:"B", justification:"Scope creep (uncontrolled changes) makes duration and budget difficult to control."},
        {q:"When would an enterprise project management department PRIMARILY use risk analysis?", opts:["During preparation for natural disasters","During go/no-go decisions","During workplace safety training development","During regulation bulletin reviews"], correct:"B", justification:"Project management uses risk analysis to assist go/no-go decisions at critical stages."}
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = [];

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderQuestion() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');

        answered = false;
        nextBtn.disabled = true;

        const qa = fullQAData[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];

        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${fullQAData.length}`;
        scoreText.textContent = `Score: ${score}`;
        progressFill.style.width = `${((currentQuestionIndex) / fullQAData.length) * 100}%`;

        const optionsHtml = qa.opts.map((opt, i) => `
            <li class="option-item" data-answer="${letters[i]}">
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${escapeHtml(opt)}</span>
            </li>
        `).join('');

        container.innerHTML = `
            <div class="question-block">
                <div class="q-meta">Q${currentQuestionIndex + 1}</div>
                <div class="question-text">${escapeHtml(qa.q)}</div>
                <ul class="options-list">${optionsHtml}</ul>
                <div id="answerBox" style="display:none;">
                    <div class="answer-result" id="answerResult"></div>
                    <div class="explanation-box">
                        <div class="explanation-title">📖 EXPLANATION</div>
                        <div class="explanation-text">${escapeHtml(qa.justification)}</div>
                    </div>
                </div>
            </div>
        `;

        document.querySelectorAll('.option-item').forEach(option => {
            option.addEventListener('click', function() {
                selectAnswer(this);
            });
        });
    }

    function selectAnswer(selectedOption) {
        if (answered) return;

        answered = true;

        const selectedAnswer = selectedOption.getAttribute('data-answer');
        const qa = fullQAData[currentQuestionIndex];
        const correctAnswer = qa.correct;

        const answerBox = document.getElementById('answerBox');
        const answerResult = document.getElementById('answerResult');
        const nextBtn = document.getElementById('nextBtn');

        userAnswers.push({
            question: qa.q,
            selected: selectedAnswer,
            correct: correctAnswer,
            isCorrect: selectedAnswer === correctAnswer
        });

        if (selectedAnswer === correctAnswer) {
            score++;
            selectedOption.classList.add('selected-correct');
            answerResult.className = 'answer-result correct';
            answerResult.innerHTML = `✓ Correct! Answer is: ${correctAnswer}`;
        } else {
            selectedOption.classList.add('selected-wrong');
            answerResult.className = 'answer-result wrong';
            answerResult.innerHTML = `✗ Wrong. Correct Answer is: ${correctAnswer}`;
            
            document.querySelectorAll('.option-item').forEach(option => {
                if (option.getAttribute('data-answer') === correctAnswer) {
                    option.classList.add('correct-answer');
                }
            });
        }

        document.getElementById('scoreText').textContent = `Score: ${score}`;
        answerBox.style.display = 'block';
        nextBtn.disabled = false;

        if (currentQuestionIndex === fullQAData.length - 1) {
            nextBtn.textContent = 'Finish Quiz';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < fullQAData.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        const percentage = Math.round((score / fullQAData.length) * 100);

        progressText.textContent = 'Quiz Completed';
        scoreText.textContent = `Final Score: ${score}/${fullQAData.length}`;
        progressFill.style.width = '100%';

        let resultMessage = '';

        if (percentage >= 90) {
            resultMessage = 'Excellent risk and security knowledge!';
        } else if (percentage >= 75) {
            resultMessage = 'Good result. Review the incorrect answers.';
        } else if (percentage >= 60) {
            resultMessage = 'Fair result. More revision is recommended.';
        } else {
            resultMessage = 'Needs improvement. Please review the full question set again.';
        }

        container.innerHTML = `
            <div class="final-result">
                <h2>🎉 Quiz Completed</h2>
                <div class="final-score">${score} / ${fullQAData.length}</div>
                <p><strong>Percentage:</strong> ${percentage}%</p>
                <p>${resultMessage}</p>
            </div>
        `;

        nextBtn.style.display = 'none';
        restartBtn.style.display = 'inline-block';
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        userAnswers = [];

        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').textContent = 'Next Question';
        document.getElementById('restartBtn').style.display = 'none';

        renderQuestion();
    }

    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        renderQuestion();
    });
</script>
