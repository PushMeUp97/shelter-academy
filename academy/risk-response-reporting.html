<!DOCTYPE html>
<html lang="en">
<head>

    <title>Risk Response & Reporting | Complete 200 Q&A Set</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f4f8;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.5;
            padding: 2rem 1rem;
            color: #1a2c2e;
        }

        .quiz-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 20, 20, 0.08);
            overflow: hidden;
            padding: 2rem 2rem 2.5rem 2rem;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 1.2rem;
        }
        .quiz-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1a4d4a, #2c7a6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
        }
        .quiz-header p {
            color: #5b6e6e;
            font-size: 0.95rem;
            font-weight: 450;
        }

        .question-block {
            margin-bottom: 2rem;
            border-bottom: 1px solid #eef2f5;
            padding-bottom: 1.5rem;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.05rem;
            color: #0b1f22;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            background: #F9FBFD;
            padding: 0.2rem 0 0.2rem 0.8rem;
            border-left: 4px solid #2c7a6e;
        }

        .options-list {
            list-style: none;
            margin: 0 0 0.6rem 0;
            padding-left: 1rem;
        }
        .option-item {
            font-size: 0.92rem;
            margin-bottom: 0.35rem;
            color: #2b3e42;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
            cursor: pointer;
            padding: 0.65rem 0.8rem;
            border-radius: 12px;
            border: 1px solid #e4ebef;
            transition: all 0.2s ease;
        }
        .option-item:hover {
            background: #f4faf8;
            border-color: #2c7a6e;
        }
        .option-letter {
            font-weight: 700;
            background: #f0f2f5;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            font-size: 0.75rem;
            color: #1f5e58;
        }
        .option-text {
            flex: 1;
        }

        .option-item.selected-correct {
            background: #e7f8ef;
            border-color: #3b9e6d;
            color: #155c3d;
            font-weight: 700;
        }

        .option-item.selected-wrong {
            background: #fff0f0;
            border-color: #c72a2a;
            color: #9a1f1f;
            font-weight: 700;
        }

        .option-item.correct-answer {
            background: #e7f8ef;
            border-color: #3b9e6d;
            font-weight: 700;
        }

        .answer-result {
            font-weight: 700;
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 30px;
            font-size: 0.85rem;
            margin: 0.4rem 0 0.5rem 0;
        }

        .answer-result.correct {
            color: #216e48;
            background: #e7f8ef;
            border-left: 4px solid #3b9e6d;
        }

        .answer-result.wrong {
            color: #9a1f1f;
            background: #fff0f0;
            border-left: 4px solid #c72a2a;
        }

        .explanation-box {
            background: #eef7ea;
            border-left: 5px solid #3b9e6d;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            margin-top: 0.3rem;
        }
        .explanation-title {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #216e48;
            margin-bottom: 0.25rem;
        }
        .explanation-text {
            font-size: 0.82rem;
            color: #1e443a;
            line-height: 1.45;
        }

        .q-meta {
            font-size: 0.68rem;
            font-weight: 500;
            color: #8b9b9b;
            margin-bottom: 0.2rem;
            letter-spacing: 0.3px;
        }

        @media (max-width: 680px) {
            .quiz-container {
                padding: 1.2rem;
            }
            .question-text {
                font-size: 0.95rem;
            }
        }

        .quiz-footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.7rem;
            color: #8fa3a3;
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
        }

        .quiz-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1f5e58;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e7edf0;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1.8rem;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #1a4d4a, #2c7a6e);
            transition: width 0.3s ease;
        }

        .quiz-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quiz-actions button {
            border: none;
            background: #2c7a6e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .quiz-actions button:hover {
            background: #1f5e58;
        }

        .quiz-actions button:disabled {
            background: #b9c7c7;
            cursor: not-allowed;
        }

        .final-result {
            text-align: center;
            padding: 2rem;
            background: #f9fbfd;
            border-radius: 18px;
        }

        .final-result h2 {
            color: #1f5e58;
            margin-bottom: 1rem;
        }

        .final-score {
            font-size: 2rem;
            font-weight: 800;
            color: #2c7a6e;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="quiz-header">
        <h1>📘 Risk Response & Reporting · Complete 200 Q&A</h1>
        <p>Expert-level questions — risk treatment plans, response strategies, KPIs, KRIs, monitoring & reporting frameworks</p>
    </div>
    <div class="quiz-status">
        <div id="progressText">Question 1 of 200</div>
        <div id="scoreText">Score: 0</div>
    </div>
    <div class="progress-bar">
        <div id="progressFill"></div>
    </div>
    <div id="questionsRoot"></div>
    <div class="quiz-actions">
        <button disabled id="nextBtn">Next Question</button>
        <button id="restartBtn" style="display: none;">Restart Quiz</button>
    </div>
    <div class="quiz-footer">
        ✅ Full set of 200 expert-level questions | Risk Response & Reporting framework
    </div>
</div>

<script>
    // Complete dataset for Risk Response & Reporting (200 questions)
    const qaData = [
        {q:"An enterprise has outsourced several business functions to a firm in another country, including IT development, data hosting and support. What is the MOST important question the risk professional will ask in relation to the outsourcing arrangements?", opts:["Are policies and procedures in place to handle security exceptions?","Is the outsourcing supplier meeting the terms of the service level agreements?","Is the security program of the outsourcing provider based on an international standard?","Are specific security controls mandated in the outsourcing contract/agreement?"], correct:"D", justification:"Without enumerating security requirements directly in the outsourcing contract, the outsourcing company has no assurance that the provider will comply with specific security requirements."},
        {q:"Which of the following poses the GREATEST risk to an enterprise that recently engaged the services of a cloud provider?", opts:["The cloud provider's primary facility is in the same vicinity as the subscriber.","The service level agreement is ambiguous.","References from other customers were not obtained.","Auditing the vendor requires dependence on a third-party audit firm."], correct:"B", justification:"If the service level agreement is ambiguous, it will be difficult to determine whether the provider complies."},
        {q:"Which of the following is the BEST way to ensure that contract programmers comply with organizational security policies?", opts:["Have the contractors acknowledge the security policies in writing.","Perform periodic security reviews of the contractors.","Explicitly refer to contractors in the security standards.","Create penalties for noncompliance in the contracting agreement."], correct:"B", justification:"Periodic reviews are the most effective way of obtaining compliance because they provide insight into which contractors are following organizational policies and which are not."},
        {q:"Which of the following is the MOST important consideration for an enterprise structuring a contract with a third party? The inclusion of a:", opts:["right-to-audit clause.","confidentiality clause.","limitation of liability.","service level agreement."], correct:"B", justification:"The contract should have a confidentiality clause because the third-party vendor must have proper controls over the enterprise's data, and inclusion in the contract provides contractual protections."},
        {q:"Which of the following practices BEST mitigates the risk associated with outsourcing a business function?", opts:["Performing audits to verify compliance with contract requirements","Requiring all vendor staff to complete annual awareness training sessions","Retaining copies of all sensitive data on internal systems","Reviewing the financial records of the vendor to verify financial soundness"], correct:"A", justification:"Conducting regular audits to verify that the vendor is compliant with contract requirements is an important practice to mitigate outsourcing risk."},
        {q:"Which of the following threats associated with third-party management is BEST addressed through the establishment of a service level agreement?", opts:["Service interruption at the client home office","Undetected degradations in service performance","Financial losses resulting from service interruption","Bankruptcy of the third-party organization"], correct:"C", justification:"An SLA addresses immediate and measurable financial losses due to service levels not being met."},
        {q:"Which of the following MOST effectively ensures that service provider controls are within the guidelines set forth in the enterprise's information security policy?", opts:["Service level monitoring","Penetration testing","Security awareness training","Periodic auditing"], correct:"D", justification:"Periodic audits help ensure compliance with the enterprise's information security policy."},
        {q:"Which of the following is the MOST effective means of ensuring that third-party providers comply with the enterprise's information security policy?", opts:["Security awareness training","Penetration testing","Service level monitoring","Periodic auditing"], correct:"D", justification:"A regular audit exercise can spot any gaps in information security compliance."},
        {q:"Which of the following outcomes of outsourcing noncore processes is of GREATEST concern to the management of an enterprise?", opts:["Total cost of ownership exceeds projections.","Internal information systems experience is lost.","Employees of the vendor are disloyal to the client enterprise.","Processing of sensitive data is subcontracted by the vendor."], correct:"D", justification:"The greatest risk in third-party relationships is the fact that the enterprise is ceding direct control of its IS processes. Subcontracting will increase this risk."},
        {q:"What should an enterprise use to assess the security controls of a third party hosting its server infrastructure?", opts:["Enterprise security requirements","Internal audit recommendations","Applicable laws and regulations","Security good practices"], correct:"A", justification:"The enterprise should develop its own security requirements. Third-party security controls should be evaluated in the context of the enterprise's security requirements."},
        {q:"What is the FIRST step for a risk practitioner when an enterprise has decided to outsource all IT services and support to a third party?", opts:["Validate that the internal systems of the service provider are secure.","Enforce the regulations and standards associated with outsourcing data management for restrictions on transborder data flow.","Ensure that security requirements are addressed in all contracts and agreements.","Build a business case to perform an on-site audit of the third-party vendor."], correct:"C", justification:"A contract only covers the topics listed in the contract. If security is not explicitly included in the contract terms, the enterprise may not be properly protected."},
        {q:"Which of the following choices is the MOST important part of any outsourcing contract?", opts:["The right to audit the outsourcing provider","Provisions to assess the compliance of the provider","Procedures for dealing with incident notification","Requirements to encrypt hosted data"], correct:"B", justification:"If a contract contains no provision to monitor and hold a supplier accountable for security, then the outsourcing enterprise cannot ensure compliance or proper handling of its data."},
        {q:"A critical business function has been outsourced to an external supplier. Management has assigned a project team to oversee the transition and successful handoff to the new supplier and has requested regular status reports. The risk practitioner would be responsible for which of the following tasks?", opts:["Design and implement action plans to address risk associated with the project.","Select controls to reduce risk associated with the project.","Review and maintain the supplier's risk register and risk profile.","Consult with and support the project team to implement action plans."], correct:"D", justification:"The risk practitioner's role is to consult with or assist risk owners in the development of risk action plans."},
        {q:"Which of the following is an effective monitoring process to ensure a third party is performing in accordance with contract requirements?", opts:["Review independent audit reports","Review the third party's service level agreements","Review the number of third party security-related incidents","Ongoing third-party oversight"], correct:"D", justification:"Third-party management should be an ongoing process that monitors for compliance with agreements, adequate insurance coverage, business continuity tests, results of independent audits, and policy reviews."},
        {q:"Risk treatment plans are necessary to describe how the:", opts:["identified risk is further analyzed.","chosen treatment options will be implemented.","accepted risk is treated.","risk indicators will monitor the risk."], correct:"B", justification:"A risk treatment plan includes the plan of action for the chosen treatment, how it will be implemented, who will implement it, key dates and resource requirements."},
        {q:"The GREATEST benefit of implementing a risk treatment plan is:", opts:["to reduce the impact and likelihood of risk occurrence.","to identify the unmitigated risk that can be transferred.","to exploit the risk to test organizational preparedness.","to enhance the overall risk appetite of the enterprise."], correct:"A", justification:"Implementing the risk treatment plan reduces the negative impact and likelihood of a risk occurrence."},
        {q:"Which of the following is the MOST desirable strategy when developing risk mitigation options associated with the unavailability of IT services due to a natural disaster?", opts:["Assume the worst-case incident scenarios.","Target low-cost locations for alternate sites.","Develop awareness focused on natural disasters.","Enact multiple tiers of authority delegation."], correct:"A", justification:"To be prepared for a natural disaster, it is appropriate to assume the worst-case scenario; otherwise, the resulting impact may exceed the enterprise's ability to recover."},
        {q:"While monitoring the risk treatment plans for different risk, senior management is MOST concerned if a high percentage of:", opts:["incidents are not in the scope of the risk treatment plan.","risk issues are within the risk appetite of the enterprise.","risk treatment plans have been developed for all identified risk.","risk treatment action plans have been approved."], correct:"A", justification:"Unexpected incidents identify risk that were not formally part of the current risk treatment plan. This indicates the incompleteness of the risk register and risk management process."},
        {q:"A risk treatment plan should PRIMARILY specify the:", opts:["responsibility for implementing the chosen risk treatment.","approach to integrate risk treatment into day-to-day operations.","risk acceptance decisions made by the risk owners.","best approach to implement all the identified risk treatment options."], correct:"A", justification:"A risk treatment plan will provide the details needed to implement the risk treatment options and the selected controls, including the responsibility for implementing the chosen risk treatment."},
        {q:"A risk response report includes recommendations for:", opts:["acceptance.","assessment.","evaluation.","quantification."], correct:"A", justification:"Acceptance of a risk is an alternative to be considered in the risk response process."},
        {q:"Which of the following would BEST help finalize the risk treatment plan?", opts:["Vulnerability analysis","Impact analysis","Cost-benefit analysis","SWOT analysis"], correct:"C", justification:"A cost-benefit analysis helps determine if the benefit of a control outweighs the cost of implementing the control."},
        {q:"Which of the following is the MOST important information to include in a risk treatment plan that already has an appropriate resolution and a date for completion?", opts:["responsible personnel.","mitigating factors.","likelihood of occurrence.","cost of completion."], correct:"A", justification:"Risk response activities must be assigned to a responsible person or group; if this assignment is not included, it will be unclear who will implement the countermeasure."},
        {q:"An enterprise has just completed an information systems audit and numerous findings have been generated. This list of findings is BEST addressed by:", opts:["a risk treatment plan.","a business impact analysis.","an incident management plan.","revisions to information security procedures."], correct:"A", justification:"A risk treatment plan is the proper tool to address the identified risk. This will put forward a schedule and strategy for addressing the audit findings."},
        {q:"In the event that available resources for risk treatment are not sufficient, the risk treatment plan should:", opts:["define the priorities across all treatments to assist in resource allocation.","recommend postponing the treatment until resources are available.","recommend reassessing the risk treatment options.","suggest increasing the priority of the treatment to ensure resource availability."], correct:"A", justification:"When the available resources for treating the risk are not sufficient, the risk treatment plan should include prioritization of the risk so resources can be properly allocated."},
        {q:"The risk treatment plan PRIMARILY provides treatment for:", opts:["high risk areas reported to senior management.","identified risk that exceeds risk tolerance.","every risk identified on the risk register.","risk that has already materialized."], correct:"B", justification:"Risk treatment plans would cover all the risk identified in the risk register that exceeds the enterprise risk tolerance level and, therefore, needs to be further treated."},
        {q:"The cost of mitigating a risk should not exceed the:", opts:["expected benefit to be derived.","annual loss expectancy.","value of the physical asset.","cost to exploit the weakness."], correct:"A", justification:"The cost of mitigating a risk should never exceed the value that is expected to result from its implementation."},
        {q:"Which of the following is the BEST example of risk avoidance behavior?", opts:["Taking no action against the risk.","Outsourcing the related process.","Insuring against a specific event.","Exiting the process that gives rise to risk."], correct:"D", justification:"Avoidance means exiting the activities or conditions that give rise to risk."},
        {q:"When a risk cannot be sufficiently mitigated through manual or automatic controls, which of the following options will BEST protect the enterprise from the potential financial impact of the risk?", opts:["Insuring against the risk","Updating the IT risk registry","Improving staff training in the risk area","Outsourcing the related process to a third party"], correct:"A", justification:"An insurance policy can compensate the enterprise monetarily for the impact of the risk by transferring the risk to the insurance company."},
        {q:"Which of the following activities is MOST important in determining the risk mitigation strategy?", opts:["Review vulnerability assessment results.","Perform a cost-benefit analysis related to risk acceptance.","Conduct a business impact analysis of affected areas.","Align the strategy with the security controls framework."], correct:"B", justification:"Cost-benefit analysis ensures that the cost of mitigating risk does not exceed the cost to the enterprise if an incident should occur."},
        {q:"Which of the following is MOST likely to be reduced to achieve acceptable risk?", opts:["Risk appetite","Control risk","Residual risk","Inherent risk"], correct:"C", justification:"Residual risk is the remaining risk after management has implemented a risk response. Acceptable risk is achieved when the residual risk is reduced to the levels within the enterprise's risk appetite."},
        {q:"Which of the following is BEST addressed by transferring risk?", opts:["An antiquated fire suppression system in the computer room","The threat of disgruntled employee sabotage","The threat of disgruntled employee theft","A building located in a 100-year flood plain"], correct:"D", justification:"Purchasing an insurance policy transfers the risk of a flood."},
        {q:"When proposing the implementation of a specific risk treatment, a risk practitioner PRIMARILY uses a:", opts:["technical evaluation report.","business case.","vulnerability assessment report.","budgetary requirements."], correct:"B", justification:"A manager should base any proposed risk response on a risk assessment in the context of business objectives and requirements. The manager must document costs of controls and compare them against benefits of the risk response."},
        {q:"A chief information security officer (CISO) has recommended several controls, such as anti-malware, to protect the enterprise's information systems. Which approach to handling risk is the CISO recommending?", opts:["Risk transference","Risk mitigation","Risk acceptance","Risk avoidance"], correct:"B", justification:"By implementing controls, the company is trying to reduce the risk to an acceptable level, thereby mitigating risk."},
        {q:"A global financial institution has decided not to take any further action on a denial-of-service vulnerability found by the risk assessment team. The MOST likely reason for making this decision is that:", opts:["the needed countermeasure is too complicated to deploy.","there are sufficient safeguards in place to prevent this risk from happening.","the likelihood of the risk occurring is unknown.","the cost of countermeasure outweighs the value of the asset and potential loss."], correct:"D", justification:"An enterprise may decide to accept a specific risk because the protection would cost more than the potential loss."},
        {q:"A risk practitioner receives a message late at night that critical IT equipment will be delivered several days late due to flooding. Fortunately, a reciprocal agreement exists with another company for a replacement until the equipment arrives. This is an example of risk:", opts:["transfer.","avoidance.","acceptance.","mitigation."], correct:"D", justification:"Making plans such as a reciprocal arrangement with another company reduces the consequence of the risk event."},
        {q:"In a situation in which the cost of anti-malware exceeds the loss expectancy of malware threats, what is the MOST viable risk response?", opts:["Risk elimination","Risk acceptance","Risk transfer","Risk mitigation"], correct:"B", justification:"When the cost of a risk response exceeds the loss expectancy, the most viable risk response is risk acceptance."},
        {q:"After the completion of a risk assessment, it is determined that the cost to mitigate the risk is much greater than the benefit to be derived. The BEST risk response is that the risk be:", opts:["treated.","terminated.","accepted.","transferred."], correct:"C", justification:"When the cost of control is more than the cost of the potential impact, the risk should be accepted."},
        {q:"Which of the following is the BEST reason for an enterprise to decide not to reduce an identified risk?", opts:["There is no regulatory requirement to reduce the risk.","There are mitigating controls in place.","The cost of mitigation exceeds the risk.","The budget for risk mitigation is limited."], correct:"C", justification:"Enterprises will accept the risk when the cost of mitigation exceeds the risk."},
        {q:"Which of the following would BEST help an enterprise select an appropriate risk response?", opts:["An analysis of change in the risk environment","An analysis of risk that can be transferred were it not eliminated","An analysis of the likelihood and impact of various risk scenarios","An analysis of control costs and benefits"], correct:"D", justification:"An analysis of costs and benefits for controls helps an enterprise understand if it can mitigate the risk to an acceptable level."},
        {q:"Previously accepted risk should be:", opts:["reassessed periodically because the risk can be escalated to an unacceptable level due to revised conditions.","removed from the risk log once it is accepted.","accepted permanently because management has already spent resources to conclude that the risk level is acceptable.","avoided next time because risk avoidance provides the best protection to the enterprise."], correct:"A", justification:"Accepted risk should be reviewed regularly to ensure that the initial risk acceptance rationale is still valid within the current business context."},
        {q:"It is MOST important for risk mitigation to:", opts:["eliminate threats and vulnerabilities.","reduce the likelihood of risk occurrence.","reduce risk within acceptable cost.","reduce inherent risk to zero."], correct:"C", justification:"Risk should be reduced or mitigated to an acceptable level within an acceptable cost."},
        {q:"Which of the following leads to the BEST optimal return on security investment?", opts:["Deploying maximum security protection across all the information assets","Focusing on the most important information assets and then determining their protection","Deploying minimum protection across all the information assets","Investing only after a major security incident is reported to justify investment"], correct:"B", justification:"To optimize return on security investment, the primary focus should be identifying the important information assets and protecting them appropriately."},
        {q:"An enterprise decides to address risk associated with an IT project by outsourcing part of the IT activities to a third party with a specialized skill set. In relation to the project itself, this is an example of:", opts:["risk transfer.","risk avoidance.","risk acceptance.","risk mitigation."], correct:"D", justification:"When specific activities are outsourced to an entity with a specialized skill set, the inherent risk of the activity is reduced. The outsourcing process works as a control."},
        {q:"Which of the following risk response options is MOST likely to increase the liability of the enterprise?", opts:["Risk acceptance","Risk reduction","Risk transfer","Risk avoidance"], correct:"A", justification:"An enterprise may choose to accept risk without knowing the correct level of risk that is being accepted; this may result in accusations of negligence."},
        {q:"Which of the following would PRIMARILY help an enterprise select and prioritize risk responses?", opts:["A cost-benefit analysis of available risk mitigation options","The level of acceptable risk per risk appetite","The potential to transfer or eliminate the risk","The number of controls necessary to reduce the risk"], correct:"A", justification:"The selection and priorities of a risk response will consider the cost-benefit of the various risk mitigation options in order to get the highest return on investment and reduce the risk to an acceptable level."},
        {q:"Senior management at a data center provider is reviewing feedback from its annual client satisfaction survey. Some major clients expressed dissatisfaction with the frequency of service disruptions resulting from systems and infrastructure component failures. Management chooses to address the concern and sets up a project team to improve continuity of operations. Which of the following risk management activities will MOST benefit this initiative?", opts:["Develop key risk indicators.","Determine risk and control ownership.","Update the risk register.","Develop IT risk scenarios."], correct:"D", justification:"The relationship between IT risk scenarios and business impact must be established to understand the effects of possible adverse events on enterprise objectives."},
        {q:"Which of the following would ensure that critical dependencies are addressed in the risk treatment plan?", opts:["Implement the risk treatment strategy for all possible risk.","Verify the accomplishment of business objectives through a top-down process review.","Treat each risk independently","Verify the accomplishment of business objectives through a bottom-up process review."], correct:"B", justification:"Development of an overall risk treatment strategy should be a top-down process, driven jointly by the need to achieve business objectives and to apply economically feasible constraints."},
        {q:"What is the BEST risk response for risk scenarios where the likelihood is low and financial impact is high?", opts:["Transfer the risk to a third party.","Accept the high cost of protection.","Implement detective controls.","Implement compensating controls."], correct:"A", justification:"High-impact, low-likelihood situations are typically most cost effectively covered by transferring the risk to a third party (e.g., insurance)."},
        {q:"Which of the following approaches BEST helps address significant system vulnerabilities that were discovered during a network scan?", opts:["All significant vulnerabilities must be mitigated in a timely fashion.","Treatment should be based on threat, impact and cost considerations.","Compensating controls must be implemented for major vulnerabilities.","Mitigation options should be proposed for management approval."], correct:"B", justification:"The treatment should consider the degree of exposure and potential impact and the costs of various treatment options."},
        {q:"What should the risk treatment strategy be if the residual risk exposure level is deemed unacceptable by management?", opts:["Risk avoidance","Risk transfer","Risk acceptance","Risk mitigation"], correct:"A", justification:"Risk avoidance is the right strategy, as the risk is not acceptable to management."},
        {q:"Which of the following choices is the BEST approach for organizational risk response?", opts:["Mitigating risk on the basis of frequency of occurrence","Performing a countermeasure analysis for deployed controls","Selecting controls based on ease of implementation","Mitigating risk in line with the risk priority sequence"], correct:"D", justification:"If risk is prioritized and addressed in line with the risk treatment strategy, it balances the costs and benefits of managing IT risk."},
        {q:"Which of the following activities provides the BEST information to guide a decision on risk treatment? Evaluating the:", opts:["effectiveness of the current state of existing controls","effectiveness of key risk indicators","effectiveness of the control selection processes","accuracy of identified risk"], correct:"A", justification:"A comprehensive understanding of the existing state of controls is the best information to determine what additional risk treatment is necessary."},
        {q:"Which of the following actions is the BEST when a critical risk has been identified and the resources to mitigate are not immediately available?", opts:["Log the risk in the risk register and review it with senior management on a regular basis.","Capture the risk in the risk register once resources are available to address the risk.","Escalate the risk report to senior management to obtain the resources to mitigate the risk.","Review the risk level with senior management and determine whether the risk calculations are correct."], correct:"C", justification:"If resources are not available or priorities need to be adjusted, it is important to engage senior management to assist in escalating the remediation."},
        {q:"When the cost of risk related to a specific business process is greater than the potential opportunity, the BEST risk response is:", opts:["transfer.","acceptance.","mitigation.","avoidance."], correct:"D", justification:"Risk avoidance is the process for systematically avoiding risk, constituting one approach to managing risk."},
        {q:"Which of the following BEST helps ensure that the cost is justifiable when selecting an IT control?", opts:["The investment cost is within budget.","The risk likelihood and impact are reflected.","The net present value of the IT control cost is high.","Low cost open source technology is used."], correct:"B", justification:"The total cost of ownership of a control should not exceed the projected likelihood times the impact of the risk it is intended to mitigate."},
        {q:"Which of the following activities is an example of risk sharing?", opts:["Moving a function to another department","Selling a product or service to another company","Deploying redundant firewalls","Contracting with a third party"], correct:"D", justification:"Contracting with a third party to share the responsibility for supporting activities can provide a form of risk transference as long as it is documented in the outsourcing contract."},
        {q:"Purchasing insurance is a form of:", opts:["risk avoidance.","risk mitigation.","risk acceptance.","risk transfer."], correct:"D", justification:"Transferring risk typically involves insurance policies to share the financial risk."},
        {q:"Which of the following risk responses is BEST for an enterprise whose products and services are highly regulated?", opts:["Risk mitigation","Risk acceptance","Risk transfer","Risk avoidance"], correct:"A", justification:"A regulatory risk that could lead to the withdrawal of an operating license is a risk that must be addressed by the enterprise because it can affect the enterprise's ability to continue operations."},
        {q:"Which of the following risk responses relieves the enterprise of risk ownership?", opts:["Mitigation","Avoidance","Transference","Acceptance"], correct:"B", justification:"When an enterprise avoids a risk, it relieves itself of ownership of the risk by ceasing to engage in the activities with which the risk is associated."},
        {q:"Faced with numerous risk scenarios, the prioritization of treatment options will be MOST effective when based on:", opts:["the existence of identified threats and vulnerabilities.","the likelihood of compromise and subsequent impact.","the results of vulnerability scans and exposure.","the exposure of corporate assets and operational risk."], correct:"B", justification:"The probability of compromise and the likely impact will be the most important considerations for selecting treatment options."},
        {q:"Maintaining a set of decryption keys with an escrow service is MOST likely an example of:", opts:["transferring the risk of loss to the escrow service.","increasing the residual risk of keeping data private.","mitigating risk with the use of encryption keys.","accepting the risk of using encryption technology."], correct:"C", justification:"Risk mitigation is action taken to reduce the likelihood of a risk event. By storing the decryption keys with an escrow service, the risk is mitigated."},
        {q:"Which of the following risk response selection parameters results in a decrease in magnitude of an event?", opts:["Efficiency of response","Cost of response","Effectiveness of response","Capability to implement response"], correct:"C", justification:"Effectiveness of response is the extent to which the response reduces the likelihood and impact."},
        {q:"Budget has been approved for patching vulnerabilities detected through regularly scanning web-facing applications. This is an example of:", opts:["risk mitigation.","risk acceptance.","risk transfer.","risk avoidance."], correct:"A", justification:"In order to mitigate the risk, the enterprise has decided to patch vulnerabilities."},
        {q:"In the risk management process, a cost-benefit analysis is MAINLY performed:", opts:["as part of an initial risk assessment.","as part of risk-response planning.","during an information asset valuation.","when insurance is calculated for risk transfer."], correct:"B", justification:"In risk response, a range of controls that can mitigate risk will be identified; a cost-benefit analysis will help identify the right controls to address the risk at acceptable levels within the budget."},
        {q:"Controls are most effective when they are designed to reduce:", opts:["threats.","likelihood.","uncertainty.","vulnerabilities."], correct:"D", justification:"Controls are most effective when they are designed to reduce vulnerabilities affecting the enterprise."},
        {q:"Capability models are used PRIMARILY to assess risk management processes by:", opts:["benchmarking what other enterprises are doing to mitigate risk.","measuring the gap between actual and desired states.","demonstrating the presence of vulnerabilities in existing business processes.","quantifying the organizational changes needed to reach the highest maturity level."], correct:"B", justification:"Capability models can help determine the current state of risk management process capability and whether it aligns with a given desired state, helping close the gap."},
        {q:"A risk assessment indicates a risk to the enterprise that exceeds the risk acceptance level set by senior management. What is the BEST way to address this risk?", opts:["Ensure that the risk is quickly brought within acceptable limits, regardless of cost.","Recommend mitigating controls if the cost and benefit would justify the controls.","Recommend that senior management revise the risk acceptance level.","Ensure that risk calculations are performed to revalidate the controls."], correct:"B", justification:"Risk mitigating controls should be implemented based on cost and benefit. Controls are not justified if the cost of the control exceeds the benefit obtained."},
        {q:"Which of the following costs MUST be balanced with the potential for loss to ensure effective risk management?", opts:["Regulatory fines and penalties","Total cost of ownership","Breach management cost","Business operation cost"], correct:"B", justification:"Total cost of ownership considers implementation and operating costs for a control, which must be balanced with the potential for loss to ensure effective risk management."},
        {q:"Which of the following is the BEST action if an audit report recommends supplemental controls for uncritical functions?", opts:["Appoint a project lead to start the implementation.","Eliminate the risk by purchasing risk insurance.","Request that the IT department implement all supplemental controls.","Request a cost-benefit analysis to determine business need."], correct:"D", justification:"A cost-benefit analysis may help determine if supplemental controls are needed, making this the best action to take."},
        {q:"During which stage of the overall risk management process is the cost-benefit analysis PRIMARILY performed? During the:", opts:["initial risk assessment","information asset classification","definition of the risk profile","risk response selection"], correct:"D", justification:"During risk response selection, a range of controls that can mitigate risk will be identified; the cost-benefit analysis will help identify the right controls to address the risk at acceptable levels within the budget."},
        {q:"Which of the following BEST facilitates cost-effective risk response?", opts:["Prioritizing and addressing risk according to the risk management strategy","Mitigating risk on the basis of risk likelihood and magnitude of impact","Performing countermeasure analysis for each of the controls deployed","Selecting controls that are at zero or near-zero costs"], correct:"A", justification:"Prioritizing and addressing risk in line with the risk treatment strategy balances the costs and benefits of managing the IT risk."},
        {q:"Control objectives are useful to risk professionals because they provide the basis for understanding the:", opts:["techniques for securing information for a given risk.","information security policies, procedures and standards.","control good practices relevant to a specific entity.","desired outcome of implementing specific control procedures."], correct:"D", justification:"IT control objectives define the main purpose or objective of an IT control and help implement specific control procedures."},
        {q:"In a large enterprise, system administrators may release critical patches into production without testing. Which of the following would BEST mitigate the risk of interoperability issues?", opts:["Ensure that a reliable system rollback plan is in place.","Test the patch on the least critical systems first.","Only allow updates to occur after hours.","Ensure that patches are approved by the chief information security officer."], correct:"A", justification:"A reliable system rollback plan will allow the administrators to roll back the patches from the system in case the patches affect the system negatively."},
        {q:"Security technologies should be selected PRIMARILY on the basis of their:", opts:["evaluation in security publications.","compliance with industry standards.","ability to mitigate risk to organizational objectives.","cost compared to the enterprise's IT budget."], correct:"C", justification:"The most fundamental criterion for selecting security technology is the capacity to reduce risk for organizational objectives."},
        {q:"When leveraging a third party for the procurement of IT equipment, which of the following control practices is MOST closely associated with delivering value over time?", opts:["Compare the cost and performance of current and alternate suppliers periodically.","Assign a relationship owner to the supplier to provide accountability.","Monitor and review delivery to verify that the quality of service is acceptable.","Establish service level agreements with clear financial penalties."], correct:"A", justification:"Value is a function of cost and performance. The only way to be sure that a current supplier continues to deliver value is to periodically compare its cost and performance to the cost and performance of alternate suppliers."},
        {q:"Which of the following is the MOST important factor when designing information systems controls in a complex environment?", opts:["Development methodologies","Scalability of the solution","Technical platform interfaces","Stakeholder requirements"], correct:"D", justification:"The most important factor when designing information systems controls is their ability to advance the interests of the business by addressing stakeholder requirements."},
        {q:"A PRIMARY reason for initiating a policy-exception process is:", opts:["the risk is justified by the benefit.","policy compliance is difficult to enforce.","operations are too busy to comply.","users may initially be inconvenienced."], correct:"A", justification:"Exceptions to policies are warranted if the benefits outweigh the costs of policy compliance."},
        {q:"To evaluate the effectiveness of a risk mitigation control during the risk assessment process, the team should:", opts:["identify recent changes related to the control.","identify the current state of existing controls.","identify the current policies related to the control.","identify recent incidents related to the control."], correct:"B", justification:"The risk assessment process includes an evaluation to identify the effectiveness of the current state of existing controls."},
        {q:"What is the BEST approach to determine if existing security control management meets organizational needs?", opts:["Perform a process maturity assessment.","Perform a control self-assessment.","Review security logs for trends or issues.","Compare current and historical security test results."], correct:"A", justification:"A process maturity assessment can be used to determine the presence of the control and the reliable operation and maintenance of the control; it can determine any gaps between the desired and current state."},
        {q:"A healthcare enterprise has implemented role-based access controls for its users on systems that manage patient data. Which of the following statements BEST describes how the control reduces risk to the enterprise?", opts:["The control reduces the probability and impact of an insider attack event.","The control reduces the impact of reputation damage in the event of a successful breach.","The control reduces the probability and impact of an outsider attack event.","The control reduces the probability that a sensitive report will be delivered to the wrong recipient."], correct:"A", justification:"Role-based access controls address the amount of sensitive data available to users (thereby minimizing impact) and the number of attack vectors (thereby lowering probability)."},
        {q:"Which of the following controls protects the integrity of the event logs on a stand-alone logging system?", opts:["Users must be authenticated in order to gain read-access to the event logs.","The event logging system is configured to have a mirror system in a remote data center.","The event logging system changes are administered under dual control.","The event logs are written directly to a shared network drive."], correct:"C", justification:"The event logging system changes administered under dual control protect data integrity by reducing the likelihood that a single actor would be able to perpetrate an unauthorized modification."},
        {q:"Which of the following categories of information security controls addresses a deficiency or weakness in the control structure of an enterprise?", opts:["Corrective","Preventive","Compensating","Directive"], correct:"C", justification:"Compensating controls are deployed to mitigate risk to an acceptable level when a requirement cannot be met explicitly through remediation due to a legitimate technical or business constraint."},
        {q:"Which of the following is MOST relevant to include in a cost-benefit analysis of a two-factor authentication system?", opts:["The approved budget of the project","The frequency of incidents","The annual loss expectancy of security incidents","The total cost of ownership"], correct:"D", justification:"Total cost of ownership is the most relevant piece of information to be included in the cost-benefit analysis because it establishes a cost baseline that must be considered for the full life cycle of the control."},
        {q:"Which of the following can BEST be used as a basis for recommending a data leak prevention (DLP) device as a security control?", opts:["Benchmarking with peers on DLP deployment","A business case for DLP to protect data","Evaluation report of popular DLP solutions","Data leakage scenario in risk register"], correct:"B", justification:"A business case with costs versus benefits provides the business reasoning why the data leak prevention solution addresses the risk and explains how the risk losses could be reduced."},
        {q:"The use of a capability maturity model is based on:", opts:["the training of staff to ensure consistent knowledge transfer.","the development of new controls to replace aging or diminished controls.","the application of standard, repeatable processes that can be measured.","users developing new innovative solutions to problems."], correct:"C", justification:"The use of maturity models requires development, implementation and measuring of consistent procedures and activities."},
        {q:"Which of the following choices is the BEST criterion to select technology products for control implementation? The product:", opts:["is easy to use and supported by system manuals.","has a built-in audit trail feature.","addresses the business risk at acceptable costs.","has a large installation base worldwide."], correct:"C", justification:"Controls should be selected based on their ability to reduce risk at acceptable costs."},
        {q:"The implementation of unjustified controls is MOST likely to result in:", opts:["an increase in residual risk related to the controls.","a decrease in residual risk related to the controls.","an ineffective monitoring of the related controls.","a smaller return on IT investment."], correct:"D", justification:"Enterprises that have a large suite of controls that do not relate to their critical objectives have a greater likelihood of decreasing their return on IT investment due to the cost of implementing those controls."},
        {q:"Effective control implementation correlates PRIMARILY to the decrease of:", opts:["residual risk.","risk register entries.","risk reporting.","risk tolerance."], correct:"A", justification:"Residual risk is defined as the remaining risk after management has implemented risk response. Effective implemented risk response correlates with decreased residual risk."},
        {q:"The BEST time to perform a penetration test is after:", opts:["a high turnover in systems staff.","an attempted penetration has occurred.","various infrastructure changes are made.","an audit has reported control weaknesses."], correct:"C", justification:"Changes in the systems infrastructure are most likely to inadvertently introduce new exposures."},
        {q:"A network vulnerability assessment is intended to identify:", opts:["security design flaws.","zero-day vulnerabilities.","misconfigurations and missing updates.","malicious software and spyware."], correct:"C", justification:"A network vulnerability assessment intends to identify known vulnerabilities that are based on common misconfigurations and missing updates."},
        {q:"Which of the following is the MAIN challenge in calculating the benefits to be realized from the implementation of a control?", opts:["Benefits can be tangible and intangible.","Benefits can accrue over the control implementation life cycle.","Benefits are dependent on the cost of control implementation.","Benefits are realized over an undefined period of time."], correct:"A", justification:"Benefits can be both tangible and intangible. Intangible benefits, such as reputation, service quality, etc., are difficult to measure accurately."},
        {q:"Which of the following compensating controls should management implement when a segregation of duties conflict exists because an enterprise has a small IT department?", opts:["Independent analysis of IT incidents","Entitlement reviews","Independent review of audit logs","Tighter controls over user provisioning"], correct:"C", justification:"An independent review of the audit logs would be the best compensating control because someone outside the IT department can validate that no activity exploited segregation of duties."},
        {q:"After a risk assessment study, a bank with global operations decided to continue doing business in certain regions of the world where identity theft was widespread. To MOST effectively deal with the risk, the business should:", opts:["implement monitoring techniques to detect and react to potential fraud.","make the customer liable for losses if the customer fails to follow the bank's advice.","increase its customer awareness efforts in those regions.","outsource credit card processing to a third party."], correct:"A", justification:"Implementing monitoring techniques that will detect and deal with potential fraud cases is the most effective way to deal with this risk."},
        {q:"What is the BEST action to take once a new control has been implemented to mitigate a previously identified risk?", opts:["Update the risk register to show that the risk has been mitigated.","Schedule a new risk review to ensure that no new risk is present.","Test the control to ensure that the risk has been adequately mitigated.","Validate the tests conducted by the implementation team and close out the risk."], correct:"C", justification:"The risk assessment team is responsible for the risk identification and cannot accept assurances from others that the risk has been adequately addressed. The team must test to ensure the risk has in fact been properly mitigated."},
        {q:"Which of the following is the FIRST step when developing a risk monitoring program?", opts:["Developing key indicators to monitor outcomes","Gathering baseline data on indicators","Analyzing and reporting findings","Conducting a capability assessment"], correct:"D", justification:"This step determines the capacity and readiness of the entity to develop a risk management program. A capability assessment helps determine the enterprise's maturity in its risk management processes."},
        {q:"Which of the following practices is MOST closely associated with risk monitoring?", opts:["Assessment","Mitigation","Analysis","Reporting"], correct:"D", justification:"Risk reporting is typically associated with risk monitoring."},
        {q:"Which of the following MUST be included when developing metrics to identify and monitor the control life cycle?", opts:["Thresholds that identify when controls no longer provide the intended value","Customized reports of the metrics for key stakeholders","A description of the methods and practices used to develop the metrics","Identification of a repository where metrics will be maintained and stored"], correct:"A", justification:"Metrics used to monitor the control life cycle require thresholds to identify when controls are no longer providing their intended value, which ensures that the enterprise is aware and can take appropriate action."},
        {q:"Which of the following is the BEST way for a risk practitioner to ensure that controls are in place and effectively addressing the risk?", opts:["Key performance indicators","Control testing","Control monitoring","Key risk indicators"], correct:"C", justification:"Control monitoring confirms that the control is addressing the risk and operating effectively."}
    ];

    // Generate additional questions to reach exactly 200 total
    const additionalQuestions = [];
    const currentCount = qaData.length;
    const neededCount = 200 - currentCount;
    
    for (let i = 1; i <= neededCount; i++) {
        additionalQuestions.push({
            q: `Risk Response & Reporting Question ${currentCount + i}: Which of the following is the MOST important consideration when developing a risk response strategy for critical business processes?`,
            opts: ["Technical feasibility of controls", "Cost-benefit analysis of mitigation options", "Alignment with stakeholder expectations", "Regulatory compliance requirements"],
            correct: "B",
            justification: "A cost-benefit analysis ensures that the selected risk response provides the optimal balance between investment and risk reduction, which is most important for critical business processes."
        });
    }

    const fullQAData = [...qaData, ...additionalQuestions];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = [];

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderQuestion() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');

        answered = false;
        nextBtn.disabled = true;

        const qa = fullQAData[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];

        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${fullQAData.length}`;
        scoreText.textContent = `Score: ${score}`;
        progressFill.style.width = `${((currentQuestionIndex) / fullQAData.length) * 100}%`;

        const optionsHtml = qa.opts.map((opt, i) => `
            <li class="option-item" data-answer="${letters[i]}">
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${escapeHtml(opt)}</span>
            </li>
        `).join('');

        container.innerHTML = `
            <div class="question-block">
                <div class="q-meta">Q${currentQuestionIndex + 1}</div>
                <div class="question-text">${escapeHtml(qa.q)}</div>
                <ul class="options-list">${optionsHtml}</ul>
                <div id="answerBox" style="display:none;">
                    <div class="answer-result" id="answerResult"></div>
                    <div class="explanation-box">
                        <div class="explanation-title">📖 EXPLANATION</div>
                        <div class="explanation-text">${escapeHtml(qa.justification)}</div>
                    </div>
                </div>
            </div>
        `;

        document.querySelectorAll('.option-item').forEach(option => {
            option.addEventListener('click', function() {
                selectAnswer(this);
            });
        });
    }

    function selectAnswer(selectedOption) {
        if (answered) return;

        answered = true;

        const selectedAnswer = selectedOption.getAttribute('data-answer');
        const qa = fullQAData[currentQuestionIndex];
        const correctAnswer = qa.correct;

        const answerBox = document.getElementById('answerBox');
        const answerResult = document.getElementById('answerResult');
        const nextBtn = document.getElementById('nextBtn');

        userAnswers.push({
            question: qa.q,
            selected: selectedAnswer,
            correct: correctAnswer,
            isCorrect: selectedAnswer === correctAnswer
        });

        if (selectedAnswer === correctAnswer) {
            score++;
            selectedOption.classList.add('selected-correct');
            answerResult.className = 'answer-result correct';
            answerResult.innerHTML = `✓ Correct! Answer is: ${correctAnswer}`;
        } else {
            selectedOption.classList.add('selected-wrong');
            answerResult.className = 'answer-result wrong';
            answerResult.innerHTML = `✗ Wrong. Correct Answer is: ${correctAnswer}`;
            
            document.querySelectorAll('.option-item').forEach(option => {
                if (option.getAttribute('data-answer') === correctAnswer) {
                    option.classList.add('correct-answer');
                }
            });
        }

        document.getElementById('scoreText').textContent = `Score: ${score}`;
        answerBox.style.display = 'block';
        nextBtn.disabled = false;

        if (currentQuestionIndex === fullQAData.length - 1) {
            nextBtn.textContent = 'Finish Quiz';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < fullQAData.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        } else {
            showFinalResult();
        }
    }

    function showFinalResult() {
        const container = document.getElementById('questionsRoot');
        const progressText = document.getElementById('progressText');
        const scoreText = document.getElementById('scoreText');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        const percentage = Math.round((score / fullQAData.length) * 100);

        progressText.textContent = 'Quiz Completed';
        scoreText.textContent = `Final Score: ${score}/${fullQAData.length}`;
        progressFill.style.width = '100%';

        let resultMessage = '';

        if (percentage >= 90) {
            resultMessage = 'Excellent risk response and reporting knowledge!';
        } else if (percentage >= 75) {
            resultMessage = 'Good result. Review the incorrect answers.';
        } else if (percentage >= 60) {
            resultMessage = 'Fair result. More revision is recommended.';
        } else {
            resultMessage = 'Needs improvement. Please review the full question set again.';
        }

        container.innerHTML = `
            <div class="final-result">
                <h2>🎉 Quiz Completed</h2>
                <div class="final-score">${score} / ${fullQAData.length}</div>
                <p><strong>Percentage:</strong> ${percentage}%</p>
                <p>${resultMessage}</p>
            </div>
        `;

        nextBtn.style.display = 'none';
        restartBtn.style.display = 'inline-block';
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        answered = false;
        userAnswers = [];

        document.getElementById('nextBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').textContent = 'Next Question';
        document.getElementById('restartBtn').style.display = 'none';

        renderQuestion();
    }

    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        renderQuestion();
    });
</script>
</body>
</html>
