<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Response & Reporting Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 20px 15px;
            color: #1d2c2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .quiz-wrapper {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 28px 30px 24px;
        }

        /* ===== HEADER ===== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e8ecf0;
        }

        .q-counter {
            font-size: 15px;
            font-weight: 600;
            color: #5a6e72;
            letter-spacing: 0.2px;
        }

        .q-counter span {
            color: #1d2c2e;
        }

        .score-badge {
            font-size: 14px;
            font-weight: 600;
            color: #1a6b5a;
            background: #e6f2ef;
            padding: 4px 16px;
            border-radius: 30px;
        }

        /* ===== QUESTION ===== */
        .question-area {
            margin-bottom: 18px;
        }

        .q-label {
            font-size: 14px;
            font-weight: 700;
            color: #7a8e92;
            letter-spacing: 0.3px;
            margin-bottom: 10px;
        }

        .q-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            color: #0b1d20;
            margin-bottom: 20px;
        }

        /* ===== OPTIONS ===== */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 2px solid #e4e8ed;
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: #ffffff;
            font-size: 16px;
            line-height: 1.5;
        }

        .option-item:hover:not(.disabled) {
            border-color: #b8cdc9;
            background: #f7faf9;
        }

        .option-item .letter {
            font-weight: 700;
            color: #5a6e72;
            flex-shrink: 0;
            min-width: 26px;
            font-size: 16px;
        }

        .option-item .text {
            flex: 1;
            color: #1d2c2e;
            word-break: break-word;
        }

        .option-item .status {
            flex-shrink: 0;
            font-size: 18px;
            margin-left: 6px;
        }

        /* Selected state */
        .option-item.selected {
            border-color: #2a7a6e;
            background: #ecf5f3;
        }

        /* Reveal states */
        .option-item.correct {
            border-color: #2d9e6b;
            background: #e6f5ed;
        }

        .option-item.incorrect {
            border-color: #d9534f;
            background: #fde8e7;
        }

        .option-item.disabled {
            cursor: default;
        }

        .option-item.disabled:hover {
            border-color: #e4e8ed;
            background: #ffffff;
        }

        .option-item.disabled.correct:hover {
            border-color: #2d9e6b;
            background: #e6f5ed;
        }

        .option-item.disabled.incorrect:hover {
            border-color: #d9534f;
            background: #fde8e7;
        }

        /* ===== EXPLANATION ===== */
        .explanation-box {
            margin-top: 18px;
            padding: 16px 20px;
            background: #f1f7f5;
            border-left: 4px solid #2a7a6e;
            border-radius: 10px;
            display: none;
        }

        .explanation-box.visible {
            display: block;
        }

        .explanation-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #1a6b5a;
            margin-bottom: 4px;
        }

        .explanation-text {
            font-size: 15px;
            color: #1d3e36;
            line-height: 1.6;
        }

        .explanation-text .correct-answer {
            font-weight: 700;
            color: #1a6b5a;
        }

        /* ===== NAVIGATION ===== */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #e8ecf0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            min-width: 100px;
            background: #e8ecf0;
            color: #3d5255;
        }

        .nav-btn:hover:not(:disabled) {
            background: #d5dce3;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .nav-btn.next-btn {
            background: #2a7a6e;
            color: #ffffff;
        }

        .nav-btn.next-btn:hover:not(:disabled) {
            background: #1f655b;
        }

        .nav-btn.finish-btn {
            background: #1a4d47;
            color: #ffffff;
        }

        .nav-btn.finish-btn:hover:not(:disabled) {
            background: #0f3a35;
        }

        .nav-center {
            font-size: 14px;
            color: #7a8e92;
            font-weight: 500;
            text-align: center;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8ecf0;
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2a7a6e, #3b9e6d);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .quiz-wrapper {
                padding: 18px 16px 16px;
            }

            .q-text {
                font-size: 17px;
            }

            .option-item {
                font-size: 15px;
                padding: 10px 14px;
            }

            .nav-btn {
                padding: 8px 16px;
                min-width: 70px;
                font-size: 14px;
            }

            .nav-controls {
                justify-content: center;
            }

            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .explanation-text {
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .quiz-wrapper {
                padding: 12px 10px 12px;
            }

            .q-text {
                font-size: 15px;
            }

            .option-item {
                font-size: 14px;
                padding: 8px 10px;
                gap: 8px;
            }

            .nav-btn {
                padding: 6px 12px;
                min-width: 60px;
                font-size: 13px;
            }

            .nav-center {
                font-size: 12px;
            }

            .explanation-text {
                font-size: 13px;
            }
        }

        /* Blogger specific - prevent overflow */
        .quiz-wrapper * {
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="quiz-wrapper" id="app">
    <!-- Header -->
    <div class="quiz-header">
        <div class="q-counter">Question <span id="currentNum">1</span> of <span id="totalNum">200</span></div>
        <div class="score-badge">Score: <span id="scoreDisplay">0</span></div>
    </div>

    <!-- Question -->
    <div class="question-area">
        <div class="q-label" id="qLabel">Q<span id="qNumLabel">1</span></div>
        <div class="q-text" id="questionText">Loading question...</div>

        <ul class="options-list" id="optionsList"></ul>

        <!-- Explanation -->
        <div class="explanation-box" id="explanationBox">
            <div class="explanation-label">📖 Explanation</div>
            <div class="explanation-text" id="explanationText"></div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
        <span class="nav-center" id="progressText">0 of 200 answered</span>
        <button class="nav-btn next-btn" id="nextBtn">Next →</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<script>
    // ============================================================
    // DATA — All 200 questions
    // ============================================================
    const questionsData = [
        // Questions 1-100 from your document
        {q:"An enterprise has outsourced several business functions to a firm in another country, including IT development, data hosting and support. What is the MOST important question the risk professional will ask in relation to the outsourcing arrangements?", opts:["Are policies and procedures in place to handle security exceptions?","Is the outsourcing supplier meeting the terms of the service level agreements?","Is the security program of the outsourcing provider based on an international standard?","Are specific security controls mandated in the outsourcing contract/agreement?"], correct:3, justification:"Without enumerating security requirements directly in the outsourcing contract, the outsourcing company has no assurance that the provider will comply with specific security requirements."},
        {q:"Which of the following poses the GREATEST risk to an enterprise that recently engaged the services of a cloud provider?", opts:["The cloud provider's primary facility is in the same vicinity as the subscriber.","The service level agreement is ambiguous.","References from other customers were not obtained.","Auditing the vendor requires dependence on a third-party audit firm."], correct:1, justification:"If the service level agreement is ambiguous, it will be difficult to determine whether the provider complies."},
        {q:"Which of the following is the BEST way to ensure that contract programmers comply with organizational security policies?", opts:["Have the contractors acknowledge the security policies in writing.","Perform periodic security reviews of the contractors.","Explicitly refer to contractors in the security standards.","Create penalties for noncompliance in the contracting agreement."], correct:1, justification:"Periodic reviews are the most effective way of obtaining compliance because they provide insight into which contractors are following organizational policies and which are not."},
        {q:"Which of the following is the MOST important consideration for an enterprise structuring a contract with a third party? The inclusion of a:", opts:["right-to-audit clause.","confidentiality clause.","limitation of liability.","service level agreement."], correct:1, justification:"The contract should have a confidentiality clause because the third-party vendor must have proper controls over the enterprise's data, and inclusion in the contract provides contractual protections."},
        {q:"Which of the following practices BEST mitigates the risk associated with outsourcing a business function?", opts:["Performing audits to verify compliance with contract requirements","Requiring all vendor staff to complete annual awareness training sessions","Retaining copies of all sensitive data on internal systems","Reviewing the financial records of the vendor to verify financial soundness"], correct:0, justification:"Conducting regular audits to verify that the vendor is compliant with contract requirements is an important practice to mitigate outsourcing risk."},
        {q:"Which of the following threats associated with third-party management is BEST addressed through the establishment of a service level agreement?", opts:["Service interruption at the client home office","Undetected degradations in service performance","Financial losses resulting from service interruption","Bankruptcy of the third-party organization"], correct:2, justification:"An SLA addresses immediate and measurable financial losses due to service levels not being met."},
        {q:"Which of the following MOST effectively ensures that service provider controls are within the guidelines set forth in the enterprise's information security policy?", opts:["Service level monitoring","Penetration testing","Security awareness training","Periodic auditing"], correct:3, justification:"Periodic audits help ensure compliance with the enterprise's information security policy."},
        {q:"Which of the following is the MOST effective means of ensuring that third-party providers comply with the enterprise's information security policy?", opts:["Security awareness training","Penetration testing","Service level monitoring","Periodic auditing"], correct:3, justification:"A regular audit exercise can spot any gaps in information security compliance."},
        {q:"Which of the following outcomes of outsourcing noncore processes is of GREATEST concern to the management of an enterprise?", opts:["Total cost of ownership exceeds projections.","Internal information systems experience is lost.","Employees of the vendor are disloyal to the client enterprise.","Processing of sensitive data is subcontracted by the vendor."], correct:3, justification:"The greatest risk in third-party relationships is the fact that the enterprise is ceding direct control of its IS processes. Subcontracting will increase this risk."},
        {q:"What should an enterprise use to assess the security controls of a third party hosting its server infrastructure?", opts:["Enterprise security requirements","Internal audit recommendations","Applicable laws and regulations","Security good practices"], correct:0, justification:"The enterprise should develop its own security requirements. Third-party security controls should be evaluated in the context of the enterprise's security requirements."},
        {q:"What is the FIRST step for a risk practitioner when an enterprise has decided to outsource all IT services and support to a third party?", opts:["Validate that the internal systems of the service provider are secure.","Enforce the regulations and standards associated with outsourcing data management for restrictions on transborder data flow.","Ensure that security requirements are addressed in all contracts and agreements.","Build a business case to perform an on-site audit of the third-party vendor."], correct:2, justification:"A contract only covers the topics listed in the contract. If security is not explicitly included in the contract terms, the enterprise may not be properly protected."},
        {q:"Which of the following choices is the MOST important part of any outsourcing contract?", opts:["The right to audit the outsourcing provider","Provisions to assess the compliance of the provider","Procedures for dealing with incident notification","Requirements to encrypt hosted data"], correct:1, justification:"If a contract contains no provision to monitor and hold a supplier accountable for security, then the outsourcing enterprise cannot ensure compliance or proper handling of its data."},
        {q:"A critical business function has been outsourced to an external supplier. Management has assigned a project team to oversee the transition and successful handoff to the new supplier and has requested regular status reports of project progress and challenges. The risk practitioner would be responsible for which of the following tasks?", opts:["Design and implement action plans to address risk associated with the project.","Select controls to reduce risk associated with the project.","Review and maintain the supplier's risk register and risk profile.","Consult with and support the project team to implement action plans."], correct:3, justification:"The risk practitioner's role is to consult with or assist risk owners in the development of risk action plans that include key elements (e.g., risk response/mitigation, cost, target date)."},
        {q:"Which of the following is an effective monitoring process to ensure a third party is performing in accordance with contract requirements?", opts:["Review independent audit reports","Review the third party's service level agreements","Review the number of third party security-related incidents","Ongoing third-party oversight"], correct:3, justification:"Third-party management should be an ongoing process that monitors for compliance with agreements, adequate insurance coverage, business continuity tests, results of independent audits, and policy reviews."},
        {q:"Risk treatment plans are necessary to describe how the:", opts:["identified risk is further analyzed.","chosen treatment options will be implemented.","accepted risk is treated.","risk indicators will monitor the risk."], correct:1, justification:"A risk treatment plan includes the plan of action for the chosen treatment, how it will be implemented, who will implement it, key dates and resource requirements."},
        {q:"The GREATEST benefit of implementing a risk treatment plan is:", opts:["to reduce the impact and likelihood of risk occurrence.","to identify the unmitigated risk that can be transferred.","to exploit the risk to test organizational preparedness.","to enhance the overall risk appetite of the enterprise."], correct:0, justification:"Implementing the risk treatment plan reduces the negative impact and likelihood of a risk occurrence."},
        {q:"Which of the following is the MOST desirable strategy when developing risk mitigation options associated with the unavailability of IT services due to a natural disaster?", opts:["Assume the worst-case incident scenarios.","Target low-cost locations for alternate sites.","Develop awareness focused on natural disasters.","Enact multiple tiers of authority delegation."], correct:0, justification:"To be prepared for a natural disaster, it is appropriate to assume the worst-case scenario; otherwise, the resulting impact may exceed the enterprise's ability to recover."},
        {q:"While monitoring the risk treatment plans for different risk, senior management is MOST concerned if a high percentage of:", opts:["incidents are not in the scope of the risk treatment plan.","risk issues are within the risk appetite of the enterprise.","risk treatment plans have been developed for all identified risk.","risk treatment action plans have been approved."], correct:0, justification:"Unexpected incidents identify risk that were not formally part of the current risk treatment plan. This indicates the incompleteness of the risk register and risk management process."},
        {q:"A risk treatment plan should PRIMARILY specify the:", opts:["responsibility for implementing the chosen risk treatment.","approach to integrate risk treatment into day-to-day operations.","risk acceptance decisions made by the risk owners.","best approach to implement all the identified risk treatment options."], correct:0, justification:"A risk treatment plan will provide the details needed to implement the risk treatment options and the selected controls, including the responsibility for implementing the chosen risk treatment."},
        {q:"A risk response report includes recommendations for:", opts:["acceptance.","assessment.","evaluation.","quantification."], correct:0, justification:"Acceptance of a risk is an alternative to be considered in the risk response process."},
        {q:"Which of the following would BEST help finalize the risk treatment plan?", opts:["Vulnerability analysis","Impact analysis","Cost-benefit analysis","SWOT analysis"], correct:2, justification:"A cost-benefit analysis helps determine if the benefit of a control outweighs the cost of implementing the control."},
        {q:"Which of the following is the MOST important information to include in a risk treatment plan that already has an appropriate resolution and a date for completion?", opts:["responsible personnel.","mitigating factors.","likelihood of occurrence.","cost of completion."], correct:0, justification:"Risk response activities must be assigned to a responsible person or group; if this assignment is not included, it will be unclear who will implement the countermeasure."},
        {q:"An enterprise has just completed an information systems audit and numerous findings have been generated. This list of findings is BEST addressed by:", opts:["a risk treatment plan.","a business impact analysis.","an incident management plan.","revisions to information security procedures."], correct:0, justification:"A risk treatment plan is the proper tool to address the identified risk. This will put forward a schedule and strategy for addressing the audit findings."},
        {q:"In the event that available resources for risk treatment are not sufficient, the risk treatment plan should:", opts:["define the priorities across all treatments to assist in resource allocation.","recommend postponing the treatment until resources are available.","recommend reassessing the risk treatment options.","suggest increasing the priority of the treatment to ensure resource availability."], correct:0, justification:"When the available resources for treating the risk are not sufficient, the risk treatment plan should include prioritization of the risk so resources can be properly allocated."},
        {q:"The risk treatment plan PRIMARILY provides treatment for:", opts:["high risk areas reported to senior management.","identified risk that exceeds risk tolerance.","every risk identified on the risk register.","risk that has already materialized."], correct:1, justification:"Risk treatment plans would cover all the risk identified in the risk register that exceeds the enterprise risk tolerance level and, therefore, needs to be further treated."},
        {q:"The cost of mitigating a risk should not exceed the:", opts:["expected benefit to be derived.","annual loss expectancy.","value of the physical asset.","cost to exploit the weakness."], correct:0, justification:"The cost of mitigating a risk should never exceed the value that is expected to result from its implementation."},
        {q:"Which of the following is the BEST example of risk avoidance behavior?", opts:["Taking no action against the risk.","Outsourcing the related process.","Insuring against a specific event.","Exiting the process that gives rise to risk."], correct:3, justification:"Avoidance means exiting the activities or conditions that give rise to risk."},
        {q:"When a risk cannot be sufficiently mitigated through manual or automatic controls, which of the following options will BEST protect the enterprise from the potential financial impact of the risk?", opts:["Insuring against the risk","Updating the IT risk registry","Improving staff training in the risk area","Outsourcing the related process to a third party"], correct:0, justification:"An insurance policy can compensate the enterprise monetarily for the impact of the risk by transferring the risk to the insurance company."},
        {q:"Which of the following activities is MOST important in determining the risk mitigation strategy?", opts:["Review vulnerability assessment results.","Perform a cost-benefit analysis related to risk acceptance.","Conduct a business impact analysis of affected areas.","Align the strategy with the security controls framework."], correct:1, justification:"Risk mitigation ensures that residual risk is maintained at an acceptable level. Cost-benefit analysis ensures that the cost of mitigating risk does not exceed the cost to the enterprise if an incident should occur."},
        {q:"Which of the following is MOST likely to be reduced to achieve acceptable risk?", opts:["Risk appetite","Control risk","Residual risk","Inherent risk"], correct:2, justification:"Residual risk is the remaining risk after management has implemented a risk response. Acceptable risk is achieved when the residual risk is reduced to the levels within the enterprise's risk appetite."},
        {q:"Which of the following is BEST addressed by transferring risk?", opts:["An antiquated fire suppression system in the computer room","The threat of disgruntled employee sabotage","The threat of disgruntled employee theft","A building located in a 100-year flood plain"], correct:3, justification:"Purchasing an insurance policy transfers the risk of a flood. Risk transfer is the process of assigning risk to another entity."},
        {q:"When proposing the implementation of a specific risk treatment, a risk practitioner PRIMARILY uses a:", opts:["technical evaluation report.","business case.","vulnerability assessment report.","budgetary requirements."], correct:1, justification:"A manager should base any proposed risk response on a risk assessment in the context of business objectives and requirements."},
        {q:"A chief information security officer (CISO) has recommended several controls, such as anti-malware, to protect the enterprise's information systems. Which approach to handling risk is the CISO recommending?", opts:["Risk transference","Risk mitigation","Risk acceptance","Risk avoidance"], correct:1, justification:"By implementing controls, the company is trying to reduce the risk to an acceptable level, thereby mitigating risk."},
        {q:"A global financial institution has decided not to take any further action on a denial-of-service vulnerability found by the risk assessment team. The MOST likely reason for making this decision is that:", opts:["the needed countermeasure is too complicated to deploy.","there are sufficient safeguards in place to prevent this risk from happening.","the likelihood of the risk occurring is unknown.","the cost of countermeasure outweighs the value of the asset and potential loss."], correct:3, justification:"An enterprise may decide to accept a specific risk because the protection would cost more than the potential loss."},
        {q:"A risk practitioner receives a message late at night that critical IT equipment will be delivered several days late due to flooding. Fortunately, a reciprocal agreement exists with another company for a replacement until the equipment arrives. This is an example of risk:", opts:["transfer.","avoidance.","acceptance.","mitigation."], correct:3, justification:"Risk mitigation attempts to reduce the impact when a risk event occurs. Making plans such as a reciprocal arrangement with another company reduces the consequence of the risk event."},
        {q:"In a situation in which the cost of anti-malware exceeds the loss expectancy of malware threats, what is the MOST viable risk response?", opts:["Risk elimination","Risk acceptance","Risk transfer","Risk mitigation"], correct:1, justification:"When the cost of a risk response exceeds the loss expectancy, the most viable risk response is risk acceptance."},
        {q:"After the completion of a risk assessment, it is determined that the cost to mitigate the risk is much greater than the benefit to be derived. The BEST risk response is that the risk be:", opts:["treated.","terminated.","accepted.","transferred."], correct:2, justification:"When the cost of control is more than the cost of the potential impact, the risk should be accepted."},
        {q:"Which of the following is the BEST reason for an enterprise to decide not to reduce an identified risk?", opts:["There is no regulatory requirement to reduce the risk.","There are mitigating controls in place.","The cost of mitigation exceeds the risk.","The budget for risk mitigation is limited."], correct:2, justification:"Enterprises will accept the risk when the cost of mitigation exceeds the risk."},
        {q:"Which of the following would BEST help an enterprise select an appropriate risk response?", opts:["An analysis of change in the risk environment","An analysis of risk that can be transferred were it not eliminated","An analysis of the likelihood and impact of various risk scenarios","An analysis of control costs and benefits"], correct:3, justification:"An analysis of costs and benefits for controls helps an enterprise understand if it can mitigate the risk to an acceptable level."},
        {q:"Previously accepted risk should be:", opts:["reassessed periodically because the risk can be escalated to an unacceptable level due to revised conditions.","removed from the risk log once it is accepted.","accepted permanently because management has already spent resources to conclude that the risk level is acceptable.","avoided next time because risk avoidance provides the best protection to the enterprise."], correct:0, justification:"Accepted risk should be reviewed regularly to ensure that the initial risk acceptance rationale is still valid within the current business context."},
        {q:"It is MOST important for risk mitigation to:", opts:["eliminate threats and vulnerabilities.","reduce the likelihood of risk occurrence.","reduce risk within acceptable cost.","reduce inherent risk to zero."], correct:2, justification:"Risk should be reduced or mitigated to an acceptable level within an acceptable cost."},
        {q:"Which of the following leads to the BEST optimal return on security investment?", opts:["Deploying maximum security protection across all the information assets","Focusing on the most important information assets and then determining their protection","Deploying minimum protection across all the information assets","Investing only after a major security incident is reported to justify investment"], correct:1, justification:"To optimize return on security investment, the primary focus should be identifying the important information assets and protecting them appropriately."},
        {q:"An enterprise decides to address risk associated with an IT project by outsourcing part of the IT activities to a third party with a specialized skill set. In relation to the project itself, this is an example of:", opts:["risk transfer.","risk avoidance.","risk acceptance.","risk mitigation."], correct:3, justification:"When specific activities are outsourced to an entity with a specialized skill set, the inherent risk of the activity is reduced. The outsourcing process works as a control."},
        {q:"Which of the following risk response options is MOST likely to increase the liability of the enterprise?", opts:["Risk acceptance","Risk reduction","Risk transfer","Risk avoidance"], correct:0, justification:"An enterprise may choose to accept risk without knowing the correct level of risk that is being accepted; this may result in accusations of negligence."},
        {q:"Which of the following would PRIMARILY help an enterprise select and prioritize risk responses?", opts:["A cost-benefit analysis of available risk mitigation options","The level of acceptable risk per risk appetite","The potential to transfer or eliminate the risk","The number of controls necessary to reduce the risk"], correct:0, justification:"The selection and priorities of a risk response will consider the cost-benefit of the various risk mitigation options in order to get the highest return on investment."},
        {q:"Senior management at a data center provider is reviewing feedback from its annual client satisfaction survey. Some major clients expressed dissatisfaction with the frequency of service disruptions resulting from systems and infrastructure component failures. Management chooses to address the concern and sets up a project team to improve continuity of operations and minimize service disruptions. Which of the following risk management activities will MOST benefit this initiative?", opts:["Develop key risk indicators.","Determine risk and control ownership.","Update the risk register.","Develop IT risk scenarios."], correct:3, justification:"The relationship between IT risk scenarios and business impact must be established to understand the effects of possible adverse events on enterprise objectives."},
        {q:"Which of the following would ensure that critical dependencies are addressed in the risk treatment plan?", opts:["Implement the risk treatment strategy for all possible risk.","Verify the accomplishment of business objectives through a top-down process review.","Treat each risk independently","Verify the accomplishment of business objectives through a bottom-up process review."], correct:1, justification:"Development of an overall risk treatment strategy should be a top-down process, driven jointly by the need to achieve business objectives and to apply economically feasible constraints."},
        {q:"What is the BEST risk response for risk scenarios where the likelihood is low and financial impact is high?", opts:["Transfer the risk to a third party.","Accept the high cost of protection.","Implement detective controls.","Implement compensating controls."], correct:0, justification:"High-impact, low-likelihood situations are typically most cost effectively covered by transferring the risk to a third party (e.g., insurance)."},
        {q:"Which of the following approaches BEST helps address significant system vulnerabilities that were discovered during a network scan?", opts:["All significant vulnerabilities must be mitigated in a timely fashion.","Treatment should be based on threat, impact and cost considerations.","Compensating controls must be implemented for major vulnerabilities.","Mitigation options should be proposed for management approval."], correct:1, justification:"The treatment should consider the degree of exposure and potential impact and the costs of various treatment options."},
        {q:"What should the risk treatment strategy be if the residual risk exposure level is deemed unacceptable by management?", opts:["Risk avoidance","Risk transfer","Risk acceptance","Risk mitigation"], correct:0, justification:"Risk avoidance is the right strategy, as the risk is not acceptable to management."},
        {q:"Which of the following choices is the BEST approach for organizational risk response?", opts:["Mitigating risk on the basis of frequency of occurrence","Performing a countermeasure analysis for deployed controls","Selecting controls based on ease of implementation","Mitigating risk in line with the risk priority sequence"], correct:3, justification:"If risk is prioritized and addressed in line with the risk treatment strategy, it balances the costs and benefits of managing IT risk."},
        {q:"Which of the following activities provides the BEST information to guide a decision on risk treatment? Evaluating the:", opts:["effectiveness of the current state of existing controls","effectiveness of key risk indicators","effectiveness of the control selection processes","accuracy of identified risk"], correct:0, justification:"A comprehensive understanding of the existing state of controls is the best information to determine what additional risk treatment is necessary."},
        {q:"Which of the following actions is the BEST when a critical risk has been identified and the resources to mitigate are not immediately available?", opts:["Log the risk in the risk register and review it with senior management on a regular basis.","Capture the risk in the risk register once resources are available to address the risk.","Escalate the risk report to senior management to obtain the resources to mitigate the risk.","Review the risk level with senior management and determine whether the risk calculations are correct."], correct:2, justification:"If resources are not available or priorities need to be adjusted, it is important to engage senior management to assist in escalating the remediation."},
        {q:"When the cost of risk related to a specific business process is greater than the potential opportunity, the BEST risk response is:", opts:["transfer.","acceptance.","mitigation.","avoidance."], correct:3, justification:"Risk avoidance is the process for systematically avoiding risk, constituting one approach to managing risk."},
        {q:"Which of the following BEST helps ensure that the cost is justifiable when selecting an IT control?", opts:["The investment cost is within budget.","The risk likelihood and impact are reflected.","The net present value of the IT control cost is high.","Low cost open source technology is used."], correct:1, justification:"The total cost of ownership of a control should not exceed the projected likelihood times the impact of the risk it is intended to mitigate."},
        {q:"Which of the following activities is an example of risk sharing?", opts:["Moving a function to another department","Selling a product or service to another company","Deploying redundant firewalls","Contracting with a third party"], correct:3, justification:"Contracting with a third party to share the responsibility for supporting activities can provide a form of risk transference as long as it is documented in the outsourcing contract."},
        {q:"Purchasing insurance is a form of:", opts:["risk avoidance.","risk mitigation.","risk acceptance.","risk transfer."], correct:3, justification:"Transferring risk typically involves insurance policies to share the financial risk."},
        {q:"Which of the following risk responses is BEST for an enterprise whose products and services are highly regulated?", opts:["Risk mitigation","Risk acceptance","Risk transfer","Risk avoidance"], correct:0, justification:"A regulatory risk that could lead to the withdrawal of an operating license is a risk that must be addressed by the enterprise because it can affect the enterprise's ability to continue operations."},
        {q:"Which of the following risk responses relieves the enterprise of risk ownership?", opts:["Mitigation","Avoidance","Transference","Acceptance"], correct:1, justification:"When an enterprise avoids a risk, it relieves itself of ownership of the risk by ceasing to engage in the activities with which the risk is associated."},
        {q:"Faced with numerous risk scenarios, the prioritization of treatment options will be MOST effective when based on:", opts:["the existence of identified threats and vulnerabilities.","the likelihood of compromise and subsequent impact.","the results of vulnerability scans and exposure.","the exposure of corporate assets and operational risk."], correct:1, justification:"The probability of compromise and the likely impact will be the most important considerations for selecting treatment options."},
        {q:"Maintaining a set of decryption keys with an escrow service is MOST likely an example of:", opts:["transferring the risk of loss to the escrow service.","increasing the residual risk of keeping data private.","mitigating risk with the use of encryption keys.","accepting the risk of using encryption technology."], correct:2, justification:"Risk mitigation is action taken to reduce the likelihood of a risk event. By storing the decryption keys with an escrow service, the risk is mitigated."},
        {q:"Which of the following risk response selection parameters results in a decrease in magnitude of an event?", opts:["Efficiency of response","Cost of response","Effectiveness of response","Capability to implement response"], correct:2, justification:"Effectiveness of response is the extent to which the response reduces the likelihood and impact."},
        {q:"Budget has been approved for patching vulnerabilities detected through regularly scanning web-facing applications. This is an example of:", opts:["risk mitigation.","risk acceptance.","risk transfer.","risk avoidance."], correct:0, justification:"In order to mitigate the risk, the enterprise has decided to patch vulnerabilities."},
        {q:"In the risk management process, a cost-benefit analysis is MAINLY performed:", opts:["as part of an initial risk assessment.","as part of risk-response planning.","during an information asset valuation.","when insurance is calculated for risk transfer."], correct:1, justification:"In risk response, a range of controls that can mitigate risk will be identified; a cost-benefit analysis will help identify the right controls to address the risk at acceptable levels within the budget."},
        {q:"Controls are most effective when they are designed to reduce:", opts:["threats.","likelihood.","uncertainty.","vulnerabilities."], correct:3, justification:"Controls are most effective when they are designed to reduce vulnerabilities affecting the enterprise."},
        {q:"Capability models are used PRIMARILY to assess risk management processes by:", opts:["benchmarking what other enterprises are doing to mitigate risk.","measuring the gap between actual and desired states.","demonstrating the presence of vulnerabilities in existing business processes.","quantifying the organizational changes needed to reach the highest maturity level."], correct:1, justification:"Capability models can help determine the current state of risk management process capability and whether it aligns with a given desired state, helping close the gap."},
        {q:"A risk assessment indicates a risk to the enterprise that exceeds the risk acceptance level set by senior management. What is the BEST way to address this risk?", opts:["Ensure that the risk is quickly brought within acceptable limits, regardless of cost.","Recommend mitigating controls if the cost and benefit would justify the controls.","Recommend that senior management revise the risk acceptance level.","Ensure that risk calculations are performed to revalidate the controls."], correct:1, justification:"Risk mitigating controls should be implemented based on cost and benefit. Controls are not justified if the cost of the control exceeds the benefit obtained."},
        {q:"Which of the following costs MUST be balanced with the potential for loss to ensure effective risk management?", opts:["Regulatory fines and penalties","Total cost of ownership","Breach management cost","Business operation cost"], correct:1, justification:"Total cost of ownership considers implementation and operating costs for a control, which must be balanced with the potential for loss to ensure effective risk management."},
        {q:"Which of the following is the BEST action if an audit report recommends supplemental controls for uncritical functions?", opts:["Appoint a project lead to start the implementation.","Eliminate the risk by purchasing risk insurance.","Request that the IT department implement all supplemental controls.","Request a cost-benefit analysis to determine business need."], correct:3, justification:"A cost-benefit analysis may help determine if supplemental controls are needed, making this the best action to take."},
        {q:"During which stage of the overall risk management process is the cost-benefit analysis PRIMARILY performed? During the:", opts:["initial risk assessment","information asset classification","definition of the risk profile","risk response selection"], correct:3, justification:"During risk response selection, a range of controls that can mitigate risk will be identified; the cost-benefit analysis will help identify the right controls to address the risk at acceptable levels within the budget."},
        {q:"Which of the following BEST facilitates cost-effective risk response?", opts:["Prioritizing and addressing risk according to the risk management strategy","Mitigating risk on the basis of risk likelihood and magnitude of impact","Performing countermeasure analysis for each of the controls deployed","Selecting controls that are at zero or near-zero costs"], correct:0, justification:"Prioritizing and addressing risk in line with the risk treatment strategy balances the costs and benefits of managing the IT risk."},
        {q:"Control objectives are useful to risk professionals because they provide the basis for understanding the:", opts:["techniques for securing information for a given risk.","information security policies, procedures and standards.","control good practices relevant to a specific entity.","desired outcome of implementing specific control procedures."], correct:3, justification:"IT control objectives define the main purpose or objective of an IT control and help implement specific control procedures."},
        {q:"In a large enterprise, system administrators may release critical patches into production without testing. Which of the following would BEST mitigate the risk of interoperability issues?", opts:["Ensure that a reliable system rollback plan is in place.","Test the patch on the least critical systems first.","Only allow updates to occur after hours.","Ensure that patches are approved by the chief information security officer."], correct:0, justification:"A reliable system rollback plan will allow the administrators to roll back the patches from the system in case the patches affect the system negatively."},
        {q:"Security technologies should be selected PRIMARILY on the basis of their:", opts:["evaluation in security publications.","compliance with industry standards.","ability to mitigate risk to organizational objectives.","cost compared to the enterprise's IT budget."], correct:2, justification:"The most fundamental criterion for selecting security technology is the capacity to reduce risk for organizational objectives."},
        {q:"When leveraging a third party for the procurement of IT equipment, which of the following control practices is MOST closely associated with delivering value over time?", opts:["Compare the cost and performance of current and alternate suppliers periodically.","Assign a relationship owner to the supplier to provide accountability.","Monitor and review delivery to verify that the quality of service is acceptable.","Establish service level agreements with clear financial penalties."], correct:0, justification:"Value is a function of cost and performance. The only way to be sure that a current supplier continues to deliver value is to periodically compare its cost and performance to the cost and performance of alternate suppliers."},
        {q:"Which of the following is the MOST important factor when designing information systems controls in a complex environment?", opts:["Development methodologies","Scalability of the solution","Technical platform interfaces","Stakeholder requirements"], correct:3, justification:"The most important factor when designing information systems controls is their ability to advance the interests of the business by addressing stakeholder requirements."},
        {q:"A PRIMARY reason for initiating a policy-exception process is:", opts:["the risk is justified by the benefit.","policy compliance is difficult to enforce.","operations are too busy to comply.","users may initially be inconvenienced."], correct:0, justification:"Exceptions to policies are warranted if the benefits outweigh the costs of policy compliance."},
        {q:"To evaluate the effectiveness of a risk mitigation control during the risk assessment process, the team should:", opts:["identify recent changes related to the control.","identify the current state of existing controls.","identify the current policies related to the control.","identify recent incidents related to the control."], correct:1, justification:"The risk assessment process includes an evaluation to identify the effectiveness of the current state of existing controls."},
        {q:"What is the BEST approach to determine if existing security control management meets organizational needs?", opts:["Perform a process maturity assessment.","Perform a control self-assessment.","Review security logs for trends or issues.","Compare current and historical security test results."], correct:0, justification:"A process maturity assessment can be used to determine the presence of the control and the reliable operation and maintenance of the control; it can determine any gaps between the desired and current state."},
        {q:"A healthcare enterprise has implemented role-based access controls for its users on systems that manage patient data. Which of the following statements BEST describes how the control reduces risk to the enterprise?", opts:["The control reduces the probability and impact of an insider attack event.","The control reduces the impact of reputation damage in the event of a successful breach.","The control reduces the probability and impact of an outsider attack event.","The control reduces the probability that a sensitive report will be delivered to the wrong recipient."], correct:0, justification:"Role-based access controls address the amount of sensitive data available to users (thereby minimizing impact) and the number of attack vectors (thereby lowering probability)."},
        {q:"Which of the following controls protects the integrity of the event logs on a stand-alone logging system?", opts:["Users must be authenticated in order to gain read-access to the event logs.","The event logging system is configured to have a mirror system in a remote data center.","The event logging system changes are administered under dual control.","The event logs are written directly to a shared network drive."], correct:2, justification:"The event logging system changes administered under dual control protect data integrity by reducing the likelihood that a single actor would be able to perpetrate an unauthorized modification."},
        {q:"Which of the following categories of information security controls addresses a deficiency or weakness in the control structure of an enterprise?", opts:["Corrective","Preventive","Compensating","Directive"], correct:2, justification:"Compensating controls are deployed to mitigate risk to an acceptable level when a requirement cannot be met explicitly through remediation due to a legitimate technical or business constraint."},
        {q:"Which of the following is MOST relevant to include in a cost-benefit analysis of a two-factor authentication system?", opts:["The approved budget of the project","The frequency of incidents","The annual loss expectancy of security incidents","The total cost of ownership"], correct:3, justification:"Total cost of ownership is the most relevant piece of information to be included in the cost-benefit analysis because it establishes a cost baseline that must be considered for the full life cycle of the control."},
        {q:"Which of the following can BEST be used as a basis for recommending a data leak prevention (DLP) device as a security control?", opts:["Benchmarking with peers on DLP deployment","A business case for DLP to protect data","Evaluation report of popular DLP solutions","Data leakage scenario in risk register"], correct:1, justification:"A business case with costs versus benefits provides the business reasoning why the data leak prevention solution addresses the risk and explains how the risk losses could be reduced."},
        {q:"The use of a capability maturity model is based on:", opts:["the training of staff to ensure consistent knowledge transfer.","the development of new controls to replace aging or diminished controls.","the application of standard, repeatable processes that can be measured.","users developing new innovative solutions to problems."], correct:2, justification:"The use of maturity models requires development, implementation and measuring of consistent procedures and activities."},
        {q:"Which of the following choices is the BEST criterion to select technology products for control implementation? The product:", opts:["is easy to use and supported by system manuals.","has a built-in audit trail feature.","addresses the business risk at acceptable costs.","has a large installation base worldwide."], correct:2, justification:"Controls should be selected based on their ability to reduce risk at acceptable costs."},
        {q:"The implementation of unjustified controls is MOST likely to result in:", opts:["an increase in residual risk related to the controls.","a decrease in residual risk related to the controls.","an ineffective monitoring of the related controls.","a smaller return on IT investment."], correct:3, justification:"Enterprises that have a large suite of controls that do not relate to their critical objectives have a greater likelihood of decreasing their return on IT investment due to the cost of implementing those controls."},
        {q:"Effective control implementation correlates PRIMARILY to the decrease of:", opts:["residual risk.","risk register entries.","risk reporting.","risk tolerance."], correct:0, justification:"Residual risk is defined as the remaining risk after management has implemented risk response. Effective implemented risk response correlates with decreased residual risk."},
        {q:"The BEST time to perform a penetration test is after:", opts:["a high turnover in systems staff.","an attempted penetration has occurred.","various infrastructure changes are made.","an audit has reported control weaknesses."], correct:2, justification:"Changes in the systems infrastructure are most likely to inadvertently introduce new exposures."},
        {q:"A network vulnerability assessment is intended to identify:", opts:["security design flaws.","zero-day vulnerabilities.","misconfigurations and missing updates.","malicious software and spyware."], correct:2, justification:"A network vulnerability assessment intends to identify known vulnerabilities that are based on common misconfigurations and missing updates."},
        {q:"Which of the following is the MAIN challenge in calculating the benefits to be realized from the implementation of a control?", opts:["Benefits can be tangible and intangible.","Benefits can accrue over the control implementation life cycle.","Benefits are dependent on the cost of control implementation.","Benefits are realized over an undefined period of time."], correct:0, justification:"Benefits can be both tangible and intangible. Intangible benefits, such as reputation, service quality, etc., are difficult to measure accurately."},
        {q:"Which of the following compensating controls should management implement when a segregation of duties conflict exists because an enterprise has a small IT department?", opts:["Independent analysis of IT incidents","Entitlement reviews","Independent review of audit logs","Tighter controls over user provisioning"], correct:2, justification:"An independent review of the audit logs would be the best compensating control because someone outside the IT department can validate that no activity exploited segregation of duties."},
        {q:"After a risk assessment study, a bank with global operations decided to continue doing business in certain regions of the world where identity theft was widespread. To MOST effectively deal with the risk, the business should:", opts:["implement monitoring techniques to detect and react to potential fraud.","make the customer liable for losses if the customer fails to follow the bank's advice.","increase its customer awareness efforts in those regions.","outsource credit card processing to a third party."], correct:0, justification:"Implementing monitoring techniques that will detect and deal with potential fraud cases is the most effective way to deal with this risk."},
        {q:"What is the BEST action to take once a new control has been implemented to mitigate a previously identified risk?", opts:["Update the risk register to show that the risk has been mitigated.","Schedule a new risk review to ensure that no new risk is present.","Test the control to ensure that the risk has been adequately mitigated.","Validate the tests conducted by the implementation team and close out the risk."], correct:2, justification:"The risk assessment team is responsible for the risk identification and cannot accept assurances from others that the risk has been adequately addressed. The team must test to ensure the risk has in fact been properly mitigated."},
        {q:"Which of the following is the FIRST step when developing a risk monitoring program?", opts:["Developing key indicators to monitor outcomes","Gathering baseline data on indicators","Analyzing and reporting findings","Conducting a capability assessment"], correct:3, justification:"This step determines the capacity and readiness of the entity to develop a risk management program. A capability assessment helps determine the enterprise's maturity in its risk management processes."},
        {q:"Which of the following practices is MOST closely associated with risk monitoring?", opts:["Assessment","Mitigation","Analysis","Reporting"], correct:3, justification:"Risk reporting is typically associated with risk monitoring."},
        {q:"Which of the following MUST be included when developing metrics to identify and monitor the control life cycle?", opts:["Thresholds that identify when controls no longer provide the intended value","Customized reports of the metrics for key stakeholders","A description of the methods and practices used to develop the metrics","Identification of a repository where metrics will be maintained and stored"], correct:0, justification:"Metrics used to monitor the control life cycle require thresholds to identify when controls are no longer providing their intended value, which ensures that the enterprise is aware and can take appropriate action."},
        {q:"Which of the following is the BEST way for a risk practitioner to ensure that controls are in place and effectively addressing the risk?", opts:["Key performance indicators","Control testing","Control monitoring","Key risk indicators"], correct:2, justification:"Control monitoring confirms that the control is addressing the risk and operating effectively."},
        {q:"Which of the following is MOST important prior to conducting a penetration test?", opts:["Nondisclosure agreements signed by testers","Documented scope defined by business objectives","Use of proprietary rather than open source tools","Senior management approval of exercise parameters"], correct:3, justification:"A penetration test has far-reaching consequences that can include denial of service, loss of confidentiality, and even a threat to the going concern of the enterprise. Thus, it is important that senior management review and approve the testing parameters before the penetration test is executed."},
        {q:"An enterprise is experiencing an increase in information compromise and cyberattacks on its network. Management is not pleased with the negative press and wants to address the underlying issue. Which of the following will provide management with the information needed to address and better understand the underlying issue?", opts:["Key performance indicators","Key risk indicators","External penetration test results","Gaps in the secure coding program"], correct:2, justification:"External penetration tests will reveal exploitable vulnerabilities on the enterprise's network. Management can take appropriate action to resolve those issues."},
        {q:"What is the MOST important criterion when reviewing information security controls?", opts:["To provide assurance to management of control monitoring","To ensure that the controls are effectively addressing risk","To review the impact of the controls on business operations and performance","To establish a baseline as a benchmark for future tests"], correct:1, justification:"The primary purpose of a control is to ensure that it is effectively addressing the risk for which the control was selected and implemented."},
        {q:"Which of the following actions will BEST preserve availability of a service during a penetration test?", opts:["Schedule testing of critical systems during maintenance windows.","Automate the testing of critical applications and servers.","Exclude noncritical systems from tests.","Establish monitoring and help desk units to handle incidents."], correct:0, justification:"Conducting the penetration tests during maintenance windows will give ample time to correct any fallout before business resumption."},
        {q:"Monitoring has flagged a security exception. What is the MOST appropriate action?", opts:["Escalate the exception.","Update the risk register.","Activate the risk response plan.","Validate the exception."], correct:3, justification:"Before any other action is taken, the risk practitioner should ensure that the exception identified by monitoring is not a false positive."},
        {q:"Which of the following metrics is the MOST useful in measuring the monitoring of violation logs?", opts:["Penetration attempts investigated","Violation log reports produced","Violation log entries","Frequency of corrective actions taken"], correct:0, justification:"The most useful metric is one that measures the degree to which complete follow-through has taken place, such as penetration attempts investigated."},
        {q:"Implementing continuous monitoring controls is the BEST option when:", opts:["legislation requires strong information security controls.","incidents may have a high impact and frequency.","incidents may have a high impact, but low frequency.","e-commerce is a primary business driver."], correct:1, justification:"Because they are expensive, continuous monitoring control initiatives are used in areas where the risk is at its greatest level. These areas have a high impact and frequency of occurrence."},
        {q:"What role does the risk professional have in regard to the IS control monitoring process? The risk professional:", opts:["maintains and operates IS controls.","approves the policies for IS control monitoring.","determines the frequency of control testing by internal audit.","assists in planning, reporting and scheduling tests of IS controls."], correct:3, justification:"The risk professional plays a key role in scheduling, supervising and reporting on risk. This includes responsibility for working with the testing teams."}
    ];

    // Questions 101-200
    const remainingQ = [
        {q:"Which of the following choices is the INITIAL step for a risk practitioner implementing continuous risk monitoring systems?", opts:["Perform compliance testing on internal controls.","Establish a risk and controls monitoring steering committee.","Document the risk to existing internal controls.","Identify high-risk areas within the enterprise."], correct:3, justification:"When implementing continuous monitoring systems, a risk practitioner's first step is to identify high-risk areas within the enterprise."},
        {q:"Which control assessment type is MOST effective for an Internet-facing application?", opts:["Vulnerability assessment","Audits","Threat risk assessments","Penetration testing"], correct:3, justification:"Penetration testing is the method used to identify exposures in Internet-facing applications and is the most effective because it is conducted by an external party."},
        {q:"Which of the following assessments of an enterprise's risk monitoring process will provide the BEST information about its alignment with industry-leading practices?", opts:["A capability assessment by an outside firm","A self-assessment of capabilities","An independent benchmark of capabilities","An internal audit review of capabilities"], correct:2, justification:"An independent benchmark of capabilities allows an enterprise to understand its level of capability compared to other enterprises within its industry."},
        {q:"The PRIMARY reason to report significant changes in IT risk to management is to:", opts:["update the information asset inventory on a periodic basis.","update the values of probability and impact for the related risk.","reconsider the degree of importance of existing information assets.","initiate a risk impact analysis to determine if additional response is required."], correct:3, justification:"The changes in information risk will impact the business process of a department or multiple departments; the security manager should report this to department heads so that they are able to initiate a risk analysis to determine the impact and if there are changes needed."},
        {q:"Which of the following types of control assessment offers the system owner the GREATEST level of assurance regarding the effectiveness of implemented security controls?", opts:["Vulnerability assessment","Third-party assurance","Penetration test","Self-assessment"], correct:2, justification:"The intent of a penetration test is to simulate a real-world attack situation with the goal of identifying how far an attacker would be able to penetrate into an environment."},
        {q:"Where are key risk indicators MOST likely identified when initiating risk management across a range of projects?", opts:["Risk governance","Risk response","Risk analysis","Risk monitoring"], correct:1, justification:"Key risk indicators (KRIs) and risk definition and prioritization are considered part of the risk response process."},
        {q:"Which of the following is the GREATEST benefit of using key risk indicators? They provide:", opts:["a backward-looking view.","an indication of risk tolerance and appetite.","an early warning signal.","an improved chance of achieving enterprise objectives."], correct:2, justification:"Providing an early warning signal is most beneficial, as it allows for proactive action to be taken."},
        {q:"Which of the following considerations is MOST important when implementing key risk indicators?", opts:["The metric is easy to measure.","The metric is easy to aggregate.","The metric can be interpreted clearly.","The metric links to a specific risk."], correct:3, justification:"Linking to a specific risk is the most important criterion when selecting a KRI. A KRI is designed to trigger a warning when the key performance indicator is approaching a threshold or tolerance."},
        {q:"The selection of key risk indicators for monitoring the risk management program should be based on selecting:", opts:["indicators that drill down to the actual symptoms of events.","indicators identified with the involvement of critical stakeholders.","a balance between lead and lag indicators.","automated systems that can provide the relevant data on indicators."], correct:2, justification:"Lead and lag indicators should be in balance because any KRI should be a combination of risk events that have occurred and proactive monitoring of risk to initiate action."},
        {q:"An enterprise is developing a key risk indicator (KRI) to determine if end users need additional security awareness training. Which of the following is the BEST KRI to implement in this situation?", opts:["Number of successful attacks","Number of lost external storage devices","Unauthorized software installations","Increase in the number of network outages"], correct:2, justification:"Users should install only authorized software. In this case, additional training is needed to prevent this activity."},
        {q:"What is the BEST approach for creating key risk indicators (KRIs) for quarterly reporting to senior leadership?", opts:["Survey senior leaders about their primary risk concerns.","Identify a list of the most common vulnerabilities in the network.","Determine which KRIs are used in similar industry verticals.","Identify the enterprise risk appetite and metrics and measures of current risk."], correct:3, justification:"Key risk indicators (KRIs) are measurable and quantifiable indicators of risk to assist in the monitoring and appropriate risk treatment proactively."},
        {q:"An operations manager assigns monitoring responsibility of key risk indicators to line staff. Which of the following is MOST effective in validating the effort?", opts:["Reported results should be independently reviewed.","Line staff should complete risk management training.","The threshold should be determined by risk management.","Indicators should have benefits that exceed their costs."], correct:0, justification:"Because key risk indicators (KRIs) are monitored by line staff, there is a chance that staff may alter results to suppress unfavorable findings. Additional reliability of monitoring metrics can be achieved by having the results reviewed by an independent party."},
        {q:"An enterprise implements lagging key risk indicators in order to:", opts:["gather data to report to management.","predict an approaching risk event.","proactively monitor the current state of the risk profile.","conduct forecasting for the risk event."], correct:0, justification:"Lagging, or backward-looking, key risk indicators (KRIs) can be used to report data to management."},
        {q:"Which of the following BEST assists in the proper design of an effective key risk indicator?", opts:["Generating the frequency of reporting cycles to report on the risk","Preparing a business case that includes the measurement criteria for the risk","Conducting a risk assessment to provide an overview of the key risk","Documenting the operational flow of the business from beginning to end"], correct:3, justification:"Prior to starting to design the KRI, a risk manager must understand the end-to-end operational flow of the business."},
        {q:"When the key risk indicator for the IT change management process reaches its threshold, a risk practitioner should FIRST report this to the:", opts:["business owner.","chief information security officer.","help desk.","incident response team."], correct:0, justification:"Reporting to the business owners first is the most appropriate action because they own the risk and determine the risk response."},
        {q:"Which of the following is MOST useful for communicating current enterprise risk to management?", opts:["Control self-assessment results","A controls inventory","Key risk indicators","Independent audit reports"], correct:2, justification:"Of the choices listed, reporting on key risk indicators is the most useful for informing management of the current state of enterprise risk."},
        {q:"Which of the following attributes of a key risk indicator is the MOST important when reviewing its effectiveness?", opts:["Repeatable","Timing","Corrective action","Actionable"], correct:0, justification:"A key risk indicator must be repeatable to be measured and to be effective over time."},
        {q:"A risk practitioner has collected several IT-related key risk indicators related to the core financial application. These would MOST likely be reported to:", opts:["key stakeholders.","the IT administrator group.","the finance department.","IT management."], correct:3, justification:"IT management is a key target group for sharing IT-related KRIs for the financial application because it makes decisions related to risk response."},
        {q:"What is the MOST important attribute of an effective key risk indicator (KRI)?", opts:["A KRI's tolerance level should be defined.","A KRI should provide quantitative data for trend analysis.","A KRI should enable consistent data collection.","A KRI should be linked to a specific risk."], correct:3, justification:"A KRI should be linked to a specific risk event in order to be useful. Without attaching it to an event, a KRI would not be useful."},
        {q:"An enterprise has contracted an external supplier to develop critical components of a consumer product. Risk tolerance levels for the outsourced component have been documented and approved. Which of the following can serve to gauge risk that may trigger stakeholder concern?", opts:["Indicators with approved thresholds","Approved status report of completed milestones","List of controls to be implemented by the supplier","Number of findings in external audit reports"], correct:0, justification:"Indicators with approved thresholds demonstrate the acceptable risk levels stakeholders are willing to tolerate, and any risk above those approved levels will likely trigger stakeholder concern."},
        {q:"What is the MOST essential attribute of an effective key risk indicator (KRI)?", opts:["The KRI is accurate and reliable.","The KRI is predictive of a risk event.","The KRI provides quantitative metrics.","The KRI indicates required action."], correct:1, justification:"A KRI should indicate that a risk is developing or changing to show that investigation is needed to determine the nature and extent of a risk."},
        {q:"An enterprise recently implemented a key risk indicator (KRI) to alert top executives of security incidents. Several security incidents were identified, but top executives were not notified. The MOST likely reason is that:", opts:["the incidents did not meet the KRI sensitivity threshold.","the KRI is not linked to a specific control.","the cost of maintaining the KRI is too high to justify.","the KRI provides results that cannot be compared over time."], correct:0, justification:"The sensitivity of a key risk indicator (KRI) determines the threshold at which reporting occurs, and each KRI is related to the risk appetite and tolerance levels of the enterprise."},
        {q:"A key risk indicator continues to trigger false positives for a network intrusion detection system. Which of the following might a risk practitioner recommend that the risk owner adjust?", opts:["Sensitivity","Timing","Frequency","Reliability"], correct:0, justification:"Reliable key risk indicators (KRIs) must measure precise and accurate data that can be validated. Adjusting the sensitivity of the false positive must be reviewed and considered."},
        {q:"A backward-looking key risk indicator is intended to:", opts:["provide early warning.","serve as a predictor.","improve risk responses.","indicate risk variances."], correct:2, justification:"KRIs that provide insight into events that have already occurred, enabling risk responses and management to be improved, are referred to as backward-looking indicators."},
        {q:"When developing key risk indicators, which of the following choices will BEST guide the risk practitioner?", opts:["Data extraction tools","Policies and regulations","Nonperforming assets","Summary reports"], correct:1, justification:"Policies and regulations oversee the business operations of the enterprise and provide the baseline for defining measures against business goals and objectives."},
        {q:"Which of the following BEST describes the reliability of a key risk indicator? The metric:", opts:["performs within the appropriate thresholds.","tests the target at predetermined intervals.","flags exceptions every time they occur.","initiates corrective action."], correct:2, justification:"KRIs that are reporting on the data points that cannot be controlled by the enterprise or are not alerting management at the correct time to an adverse condition must be adjusted to be more precise, more relevant or more accurate."},
        {q:"Which of the following provides the BEST capability to identify whether controls that are in place remain effective in mitigating their intended risk?", opts:["A key performance indicator","A risk assessment","A key risk indicator","An audit"], correct:2, justification:"A key risk indicator (KRI) identifies whether a risk exists and has the potential to be realized in a way that would have a negative impact on the enterprise."},
        {q:"Which of the following is PRIMARILY defined before establishing key control indicators?", opts:["Desired capacity","Desired risk threshold","Desired tolerances","Desired risk appetite"], correct:2, justification:"The goal of KCIs is to track performance of control actions relative to tolerances, providing insight into the ongoing adequacy of a given control in keeping risk within acceptable levels."},
        {q:"Which indicator ensures that the enterprise's risk is effectively treated?", opts:["An indicator that is used to define the control environment and measures toward tolerance","An indicator implemented to detect and signal the root cause of a risk event","An indicator used to define and monitor changes in the risk profile","An indicator used to define performance targets and measure progress toward goals"], correct:0, justification:"Control indicators are used to determine the effectiveness of an enterprise's controls designed to treat risk."},
        {q:"Which of the following would BEST measure the effectiveness of operational controls?", opts:["Control matrix","Key performance indicator","Statement of applicability","Key control indicator"], correct:3, justification:"Key control indicators, also referred to as control effectiveness indicators, are metrics that provide information on the degree to which a control is working."},
        {q:"Which of the following is the MAIN reason senior management monitors and analyzes trends in key control indicators?", opts:["It provides feedback on the overall control environment.","It helps in identifying redundant controls.","It proactively identifies impacts to the risk profile.","It helps determine if additional controls are required."], correct:2, justification:"The primary objective of key control indicators (KCIs) is to ensure that controls actually mitigate risk at an effective level. Analysis of KCI trends provides information on the overall effectiveness of controls."},
        {q:"Which of the following can be expected when a key control is being maintained at an optimal level?", opts:["The shortest lead time until the control breach comes to the surface","Balance between control effectiveness and cost","An adequate maturity level of the risk management process","An accurate estimation of operational risk amounts"], correct:1, justification:"Maintaining controls at an optimal level translates into a balance between control cost and derived benefit."},
        {q:"Which of the following activities provides the BEST basis for establishing risk ownership?", opts:["Documenting interdependencies between departments and business processes","Mapping identified risk to a specific business process","Referring to available RACI charts for business processes","Distributing risk among identified business process owners"], correct:1, justification:"Mapping identified risk to a specific business process helps identify the process owner. Aggregation of related business processes results in identification of the prospective risk owner."},
