        {q:"As part of risk monitoring, the administrator of a two-factor authentication system identifies a trusted independent source indicating that the algorithm used for generating keys has been compromised. The vendor of the authentication system has not provided further information. Which of the following is the BEST initial course of action?", opts:["Wait for the vendor to formally confirm the breach and provide a solution.","Determine and implement suitable compensating controls.","Identify all systems requiring two-factor authentication and notify their business owners.","Disable the system and rely on single-factor authentication until further information is received."], correct:2, justification:"Business owners should be notified, even when some information may not be available. Business owners are responsible for responding to new risk."},
        {q:"Which of the following is MOST important for effective risk management?", opts:["Assignment of risk owners to identified risk","Ensuring compliance with regulatory requirements","Integration of risk management into operational processes","Implementation of a risk avoidance strategy"], correct:0, justification:"It is of utmost importance to assign risk to individual owners and therein maximize accountability."},
        {q:"Which of the following is critical to the risk practitioner for an effective risk management program?", opts:["Risk response strategy","Risk register content","Risk profile content","Risk owners and accountability"], correct:3, justification:"The identification of risk owners is critical because risk owners must make informed and cost-effective business decisions regarding appropriate controls to mitigate their owned risk."},
        {q:"Which of the following is a PRIMARY role of the system owner during the accreditation process? The system owner:", opts:["reviews and approves the security plan supporting the system.","selects and documents the security controls for the system.","assesses the security controls in accordance with the assessment procedures.","determines whether the risk to the business is acceptable."], correct:1, justification:"The system owner specifies the information security controls for the system being deployed based on functional requirements from the information owner."},
        {q:"When aligning controls with business objectives, what is MOST important?", opts:["Monitoring control activities periodically","Ensuring ownership of key control activities","Reviewing the risk management strategy","Prioritizing control activities based on residual risk"], correct:1, justification:"Ensuring ownership of key control activities is the most important factor in assigning control responsibility and control accountability."},
        {q:"The MOST effective starting point to determine whether an IT system continues to meet the enterprise's business objectives is to conduct interviews with:", opts:["executive management.","IT management.","business process owners.","external auditors."], correct:2, justification:"Business process owners are an effective starting point for conducting interviews to ensure that IT systems are meeting their individual business process needs."},
        {q:"An enterprise is implementing controls to protect a list of employee details from being exposed to unauthorized individuals. The internal control requirements will come from:", opts:["the risk management team.","internal audit.","IT management.","process owners."], correct:3, justification:"Process owners will provide the internal control requirements based on the business needs and objectives."},
        {q:"When a significant vulnerability is discovered in the security of a critical web server, immediate notification should be made to the:", opts:["development team to remediate.","data owners to mitigate damage.","system owner to take corrective action.","incident response team to investigate."], correct:2, justification:"To correct the vulnerabilities, the system owner needs to be notified quickly, before an incident can take place."},
        {q:"During the risk assessment process, it is MOST important to establish a clear line of accountability to:", opts:["ensure that the risk assessment is completed on time.","ensure that there is adequate participation and feedback.","ensure that risk ownership is assigned to the appropriate level.","ensure that risk identified in the process is mitigated."], correct:2, justification:"Applying risk ownership to the appropriate level is the most important element in establishing a clear line of accountability."},
        {q:"A substantive test to verify that tape library inventory records are accurate involves:", opts:["determining whether bar code readers are installed.","conducting a physical count of the tape inventory.","checking whether receipts and issues of tapes are accurately recorded.","determining whether the movement of tapes is authorized."], correct:1, justification:"A substantive test involves gathering evidence to evaluate the integrity of individual transactions, data or other information. Conducting a physical count of the tape inventory is a substantive test."},
        {q:"Which of the following is MOST important to ensure meaningful reporting of key risk indicators? Data are extracted from:", opts:["a variety of control types.","a representative sample.","automated systems.","direct sources."], correct:1, justification:"Data extracted from a representative sample will provide the most meaningful reporting because multiple controls will be taken into consideration to derive the current level of risk."},
        {q:"Which of the following choices is the GREATEST risk related to the review of log files?", opts:["Logs are not backed up periodically.","Unauthorized system actions are not identified.","Routine events are recorded.","Procedures for reviewing logs are not documented."], correct:1, justification:"The review of log files is to detect system-related activities. Failure to identify unauthorized system actions during the review of log files poses a risk to the business."},
        {q:"How can an enterprise determine the aggregated risk from several sources? Through a:", opts:["security information and event management system","fault tree analysis","failure modes and effects analysis","business impact analysis"], correct:0, justification:"A security information and event management system gathers incident activity from several locations and prepares reports on risk trends and correlated events."},
        {q:"Investments in risk management technologies should be based on:", opts:["audit recommendations.","vulnerability assessments.","business climate.","value analysis."], correct:3, justification:"Investments in risk management technologies should be based on a value analysis and a sound business case."},
        {q:"The BEST reason to implement a maturity model for risk management is to:", opts:["establish alignment with business objectives.","help improve governance and compliance.","ensure that security controls are effective.","enable continuous improvement."], correct:3, justification:"Maturity models are designed to enable continuous improvement. This is achieved by first assessing the current maturity level of specific business processes and determining whether it is congruent with the desired maturity levels."},
        {q:"Which of the following controls within the user provision process BEST ensures revocation of system access for contractors and other temporary users when it is no longer required?", opts:["Log all account usage and send it to the users' managers.","Establish predetermined, automatic expiration dates.","Ensure that each user signs a security acknowledgment.","Require managers to email security when the user leaves."], correct:1, justification:"Predetermined expiration dates are the most effective means of removing systems access for temporary users."},
        {q:"Which of the following information security controls mandates behavior by specifying what is and is not permitted?", opts:["Managerial","Detective","Corrective","Preventive"], correct:0, justification:"Managerial controls, such as policies, specify what actions are and are not permitted."},
        {q:"Which of the following controls can reduce the potential impact of a malicious hacker who gains access to an administrator account?", opts:["Multifactor authentication","Audit logging","Least privilege","Password policy"], correct:2, justification:"Least privilege can reduce the impact of a compromised account within the scope of its intended use and limit impact to the enterprise as a whole."},
        {q:"Which of the following is an example of a directive control in relation to risk management?", opts:["Active user authentication","An enterprise policy","Inhibiting security policy violations","Regular remediation of errors"], correct:1, justification:"An enterprise policy states the enterprise's directive related to risk management; therefore, it is a directive control."},
        {q:"A supervisor's review of an enterprise's firewall logs is a:", opts:["physical control.","technical control.","administrative control.","legal control."], correct:2, justification:"While the firewall is a technical control, the review of the firewall logs is performed by a specific individual (the supervisor) operating a process, and therefore, it is an administrative control."},
        {q:"A process by which someone logs onto a website, then receives a token via a short message service (SMS) message, is an example of what control type?", opts:["Deterrent","Directive","Compensating","Preventive"], correct:3, justification:"The use of a token with a short message service (SMS) message will prevent unauthorized access to the system through two-factor authentication."},
        {q:"System backup and restore procedures can BEST be classified as:", opts:["Technical controls","Detective controls","Corrective controls","Deterrent controls"], correct:2, justification:"Corrective controls remediate the impact from negative events. If a system suffers harm so extensive that processing cannot continue, backup restore procedures enable that system to be recovered."},
        {q:"The MOST important reason for reporting control effectiveness as part of risk reporting is that it:", opts:["enables audit reporting.","affects the risk profile.","requires mitigation.","helps manage the control life cycle."], correct:1, justification:"Changes may render a control ineffective and allow a vulnerability to be exploited. Changes in control may also strengthen the enterprise's risk profile."},
        {q:"An enterprise implemented a new control to mitigate a recurring risk event. Which of the following would BEST measure the effectiveness of the implemented control?", opts:["Reduction in financial impact on the annual report","Measurable reduction in likelihood, impact or both","Readjustment of risk appetite to meet residual risk","Increased efficiency over the appropriate processes"], correct:1, justification:"The reduction of likelihood or impact of occurrence is the best measurement to ensure that controls are effective."},
        {q:"One way to determine control effectiveness is by determining:", opts:["the test results of intended objectives.","whether it is preventive, detective or compensatory.","the capability of providing notification of failure.","the evaluation and analysis of reliability."], correct:0, justification:"Control effectiveness requires a way to verify that the control process worked as intended. For example, dual-control or dual-entry bookkeeping provide verification and assurance that the process operated as intended."},
        {q:"What is the BEST method to validate the effectiveness of an enterprise's patching program?", opts:["Conduct penetration testing.","Conduct a risk identification initiative.","Carry out vulnerability scans.","Review the requests for change."], correct:2, justification:"Performing vulnerability scans will enable the IT risk practitioner to determine if patches are being installed on a timely basis."},
        {q:"Which of the following should be in place before a black box penetration test begins?", opts:["A clearly stated definition of scope","Previous test results","Proper communication and awareness training","An incident response plan"], correct:0, justification:"A clearly stated definition of scope ensures a proper understanding of risk and success criteria."},
        {q:"Which of the following BEST helps the risk practitioner identify IS control deficiencies?", opts:["An IT control framework","Defined control objectives","A countermeasure analysis","A threat analysis"], correct:1, justification:"Controls are deployed to achieve the desired objectives based on risk assessment and to meet the business requirements."},
        {q:"Which of the following BEST ensures that identified risk remains at an acceptable level?", opts:["Reviewing controls periodically, according to the risk treatment plan","Listing each risk as a separate entry in the risk register","Creating a separate risk register for every department","Maintaining a key risk indicator for assets in the risk register"], correct:0, justification:"Controls deployed according to the risk treatment plan should provide the desired results, because the risk treatment plan is based on management's acceptance of residual risk."},
        {q:"Which of the following controls is an example of one that reduces the probability of a risk event?", opts:["A change management process requires that intersystem dependencies be considered prior to approval of system downtime.","A call tree procedure for reporting data center incidents is in place.","An infrastructure investment plan includes support for two different application hosting platforms to protect against obsolescence.","After terminations, employee equipment is placed on legal hold for 60 days before being recycled into production."], correct:0, justification:"This control reduces the probability of a risk event by identifying potential issues ahead of time."},
        {q:"An IT department has put in place an anti-malware system to reduce risk. Assuming the control is working within specified parameters, which of the following statements BEST describes how this control reduces risk?", opts:["The control reduces the probability of malware on enterprise computers but does not reduce the impact of attacks.","The control reduces the impact of malware on enterprise computers but does not reduce the probability of attacks.","The control reduces the probability and impact of malware on enterprise computers.","The control reduces neither probability nor impact of malware on enterprise computers."], correct:1, justification:"The control eliminates the ability of malware files to execute or propagate outside of protected systems, thus reducing the impact. The system does not mitigate the source of the files."},
        {q:"The BEST way to ensure that an information systems control is appropriate and effective is to verify that the:", opts:["control is operating as designed.","risk associated with the control is mitigated.","control has not been bypassed.","control logs are reviewed frequently."], correct:1, justification:"A control is designed to mitigate or reduce a risk. Even if the control is operating correctly, it is not the appropriate control if it does not address the risk it was designed to mitigate."},
        {q:"Which of the following controls is an example of one that reduces the impact of a risk event?", opts:["A firewall is implemented at the network perimeter and configured to block all unauthorized inbound traffic.","Backup procedures that include storage of multiple iterations are in place for critical application files.","A personnel policy dictates that employees must complete compliance awareness training.","Processing facility entrances are controlled using card readers and attendants."], correct:1, justification:"Backup procedures that include storage of multiple iterations in place for critical application files reduce the impact of a risk event by maintaining older versions of files for a period of time after they are modified."},
        {q:"Which of the following is the BEST way to ensure that a corporate network is adequately secured against external attack?", opts:["Use an intrusion detection system.","Establish minimum security baselines.","Implement vendor recommended settings.","Perform periodic penetration testing."], correct:3, justification:"Penetration testing is the best way to ensure that perimeter security is adequate."},
        {q:"The MOST important objective of regularly testing information system controls is to:", opts:["identify design flaws, failures and redundancies.","provide the necessary evidence to support management assertions.","assess the control risk and formulate an opinion on the level of reliability.","evaluate the need for a risk assessment and indicate the corrective actions to be taken, where applicable."], correct:0, justification:"Identification of design flaws, failures and redundancies is necessary to ensure that the control is designed correctly and is operating effectively and efficiently during the production phase."},
        {q:"Testing compliance of a response and recovery plan should begin by conducting a:", opts:["tabletop exercise.","review of archived logs.","penetration test.","business impact analysis."], correct:0, justification:"Tabletop exercises simulate incidents to test the response capability of an enterprise. The exercise involves scenarios that require a coordinated response to realistic incidents developing in real time."},
        {q:"Business stakeholders and decision makers reviewing the effectiveness of IT risk responses would PRIMARILY validate whether:", opts:["IT controls eliminate the risk in question.","IT controls are continuously monitored.","IT controls achieve the desired objectives.","IT risk indicators are formally documented."], correct:2, justification:"The stakeholders are most interested in whether the control meets the stated objectives."},
        {q:"What is the MOST important reason for periodically testing controls?", opts:["To meet regulatory requirements","To meet due care requirements","To ensure that control objectives are met","To achieve compliance with standard policy"], correct:2, justification:"Periodically testing controls ensures that controls continue to meet control objectives."},
        {q:"A financial institution is undergoing testing of its electronic funds transfer (EFT) system after major enhancements. The risk practitioner would MOST benefit from a test that:", opts:["identifies the introduction of potential new gaps in security.","verifies adequate system recovery in case of failure.","ensures the system performs to expectation.","ensures the system can support the volume of transactions."], correct:0, justification:"The security of an electronic funds transfer (EFT) system would be of the most interest to a risk practitioner. Testing should identify the introduction of potential new gaps in information security."},
        {q:"Which of the following options BEST ensures that an identified risk is mitigated?", opts:["Control metrics","Control testing","Control objective","Control ownership"], correct:1, justification:"Control testing determines the effectiveness of the controls in achieving their stated objectives, ensuring that the risk is mitigated."},
        {q:"Which of the following BEST mitigates control risk?", opts:["Continuous monitoring","An effective security awareness program","Effective change management procedures","Senior management support for control implementation"], correct:0, justification:"Continuous monitoring tests controls that mitigate the risk of the control being less effective over time."},
        {q:"Which of the following BEST enables an enterprise to measure its risk management process against peers?", opts:["Adoption of an enterprise architecture model","Adoption of a balanced scorecard","Adoption of a risk assessment methodology","Adoption of a maturity model"], correct:3, justification:"A maturity model consists of various levels of competence that enterprises can use as benchmarks to assess how they compare to peers."},
        {q:"Which of the following BEST ensures that appropriate mitigation occurs on identified information systems vulnerabilities?", opts:["Presenting root cause analysis to the management of the enterprise","Implementing software to input the action points","Incorporating the findings into the annual report to shareholders","Assigning action plans with deadlines to responsible personnel"], correct:3, justification:"Assigning mitigation to personnel establishes responsibility for its completion within the deadline."},
        {q:"Which of the following BEST enables a peer review of an enterprise's risk management process?", opts:["A balanced scorecard","An industry survey","A capability maturity model","A framework"], correct:2, justification:"A capability maturity model describes essential elements and criteria for effective processes for one or more disciplines. It also outlines an evolutionary improvement path from ad hoc, immature processes to disciplined, mature processes."},
        {q:"What is the PRIMARY reason for reporting significant changes in information risk to senior management?", opts:["To revise the key risk indicators","To enable educated decision-making","To gain support for new countermeasures","To recalculate the value of existing information assets"], correct:1, justification:"The changes in information risk will impact critical business processes. The risk practitioner should report this to management so that management is able make informed risk response decisions."},
        {q:"The PRIMARY objective of risk reporting is to:", opts:["keep stakeholders informed and reduce the level of enterprise risk.","provide the risk owner with information to initiate risk response.","control the threat environment by limiting the potential consequences.","guarantee the open sharing of information related to enterprise risk."], correct:1, justification:"The risk owner is accountable for properly managing any given risk to an acceptable level. Risk reporting provides the risk owner with a summary of the risk assessment results and highlights areas that require attention."},
        {q:"Which of the following BEST helps while presenting the current risk profile to executive management and the board of directors?", opts:["Risk response dashboard","Emerging risk report","Risk register dashboard","Key risk indicators report"], correct:2, justification:"A risk register dashboard would provide a comprehensive overview of the risk profile of the enterprise."},
        {q:"Which of the following is MOST suitable for reporting IT-related business risk to senior management?", opts:["Balanced scorecards","Gantt charts","Technical vulnerability reports","Dashboards"], correct:3, justification:"Dashboards are most suitable for reporting risk to senior management because they provide a high-level overview of risk levels that can be easily understood."},
        {q:"The presentation of a risk report should be PRIMARILY tailored to the:", opts:["risk rating.","target audience.","scope of activities.","threat levels."], correct:1, justification:"The purpose of risk reporting is to allow informed decisions to be made and appropriate actions to be taken. Each audience is different, and the format of a risk report should be tailored to the target audience."},
        {q:"Which of the following activities is related to the use of key performance indicators for management of technology controls?", opts:["Conducting a threat modeling exercise for technology used by a business line","Measurement of control effectiveness to determine that business requirements are being met","Implementation of controls to meet control objectives","Monitoring the threat environment for changes in probability of key risk events"], correct:1, justification:"Key performance indicators (KPIs) can be used to determine whether a control is operating within management-specified requirements."},
        {q:"Which characteristic of a key performance indicator demonstrates that it is realistic and based on important goals and values?", opts:["Specific","Relevant","Measurable","Attainable"], correct:3, justification:"An attainable KPI is one that is realistic and based on important goals and values."},
        {q:"A company has set the unacceptable error level at 10 percent. Which of the following tools can be used to trigger a warning when the error level reaches eight percent?", opts:["A fault tree analysis","Statistical process control","A key performance indicator","A failure modes and effects analysis"], correct:2, justification:"A key performance indicator (KPI) is a tool that will show a performance change indication. A KPI is a measure that determines how well the process is performing."},
        {q:"Which of the following criteria is MOST essential for the effectiveness of operational metrics?", opts:["Relevance to the recipient","Timeliness of the reporting","Accuracy of the measurement","Cost of obtaining the metrics"], correct:0, justification:"Unless the metric is relevant to the recipient and the recipient understands what the metric means and what action to take, if any, all other criteria are of little importance."},
        {q:"Which of the following IS control practices provides the BEST key performance indicator of an enterprise's disaster recovery readiness?", opts:["The approved disaster recovery plan","The presence of a hot site","The results of tests and drills","An updated call tree and escalation mechanism"], correct:2, justification:"Results of tests and drills are the best evidence that the enterprise is prepared for disaster recovery because the enterprise can test what would occur in a simulated disaster scenario."},
        {q:"What is the enterprise ensuring by using key performance indicators?", opts:["The internal controls are effective.","The risk profile is known, and impact to risk tolerance is assessed.","The business goals are being achieved.","The desired metrics are achieved."], correct:3, justification:"Key performance indicators ensure desired performance levels and metrics are achieved."},
        {q:"A process associated with an established key performance indicator (KPI) requires attention when it shows values:", opts:["outside of a threshold.","higher than the average.","lower than the average.","fluctuating over time."], correct:0, justification:"Key performance indicators (KPIs) are leading indicators meant to provide insight into whether associated goals will be reached. What reveals that a process requires attention is an associated KPI's movement outside the process threshold."},
        {q:"In an operational review of the processing environment, which indicator would be MOST beneficial?", opts:["User satisfaction","Audit findings","Regulatory changes","Management changes"], correct:0, justification:"User satisfaction measures how the business process meets or surpasses expectation."},
        {q:"Which of the following is an example of a key performance indicator?", opts:["Average network availability uptime","Average number of missed patches","Average number of data entry errors","Average number of virus and phishing attacks"], correct:0, justification:"Average network availability is an example of a key performance indicator."},
        {q:"The management of an enterprise's physical access controls has been outsourced to an external supplier. Requirements for access approval and acceptance have been agreed on, documented and communicated between the enterprise and the supplier. During a quarterly status meeting, the enterprise decides to terminate the agreement with the supplier. Which of the following MUST have provided the information that triggered the business decision?", opts:["Review of key risk indicators and thresholds","An audit of the supplier's information processing facilities","Review of the supplier's risk register","Review of key performance indicators"], correct:3, justification:"Key performance indicators provide information on how well a control environment is reaching its goals/objectives; KPIs also indicate impact to the client's control environment."},
        {q:"What is the MOST important control that should be in place to safeguard against the misuse of the corporate social media account?", opts:["Social media account monitoring","Two-factor authentication","Awareness training","Strong passwords"], correct:1, justification:"Use of two-factor authentication will proactively protect the account from unauthorized access."},
        {q:"Which of the following is the PRIMARY reason for periodically monitoring key risk indicators (KRIs)?", opts:["The cost of risk response needs to be minimized.","Errors in the results of KRIs need to be minimized.","The risk profile may have changed.","Risk assessment needs to be continually improved."], correct:2, justification:"The risk impacting the enterprise can change over time and periodic monitoring of KRIs proactively identifies changes in the risk profile so that new risk can be addressed."}
    ];

    // Combine all questions
    const questions = [...questionsData, ...remainingQ];
    const totalQuestions = questions.length;

    // State
    let currentIndex = 0;
    let selectedAnswers = new Array(totalQuestions).fill(null);
    let showExplanation = new Array(totalQuestions).fill(false);
    let score = 0;
    let answeredQuestions = new Array(totalQuestions).fill(false);
    let quizCompleted = false;

    // DOM refs
    const questionText = document.getElementById('questionText');
    const optionsList = document.getElementById('optionsList');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentNum = document.getElementById('currentNum');
    const totalNum = document.getElementById('totalNum');
    const qNumLabel = document.getElementById('qNumLabel');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    const letters = ['A', 'B', 'C', 'D'];

    function renderQuestion() {
        const q = questions[currentIndex];
        if (!q) return;

        // Update question number
        currentNum.textContent = currentIndex + 1;
        totalNum.textContent = totalQuestions;
        qNumLabel.textContent = currentIndex + 1;

        // Update question text
        questionText.textContent = q.q;

        // Render options
        optionsList.innerHTML = '';
        q.opts.forEach((opt, idx) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            if (selectedAnswers[currentIndex] === idx) {
                li.classList.add('selected');
            }
            if (showExplanation[currentIndex]) {
                li.classList.add('disabled');
                if (idx === q.correct) {
                    li.classList.add('correct');
                } else if (selectedAnswers[currentIndex] === idx && idx !== q.correct) {
                    li.classList.add('incorrect');
                }
            }

            const letterSpan = document.createElement('span');
            letterSpan.className = 'letter';
            letterSpan.textContent = letters[idx];

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = opt;

            const statusSpan = document.createElement('span');
            statusSpan.className = 'status';
            if (showExplanation[currentIndex]) {
                if (idx === q.correct) {
                    statusSpan.textContent = '✓';
                } else if (selectedAnswers[currentIndex] === idx && idx !== q.correct) {
                    statusSpan.textContent = '✗';
                }
            }

            li.appendChild(letterSpan);
            li.appendChild(textSpan);
            li.appendChild(statusSpan);

            if (!showExplanation[currentIndex]) {
                li.addEventListener('click', () => handleOptionClick(idx));
            }

            optionsList.appendChild(li);
        });

        // Show/hide explanation
        if (showExplanation[currentIndex]) {
            explanationBox.classList.add('visible');
            const qData = questions[currentIndex];
            const correctLetter = letters[qData.correct];
            explanationText.innerHTML = `
                <span class="correct-answer">Correct answer: ${correctLetter}</span><br><br>
                ${qData.justification}
            `;
        } else {
            explanationBox.classList.remove('visible');
        }

        // Update navigation buttons
        prevBtn.disabled = currentIndex === 0;

        if (currentIndex === totalQuestions - 1) {
            if (quizCompleted) {
                nextBtn.textContent = '✓ Done';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = 'Finish';
                nextBtn.className = 'nav-btn finish-btn';
            }
        } else {
            nextBtn.textContent = 'Next →';
            nextBtn.className = 'nav-btn next-btn';
            nextBtn.disabled = false;
        }

        // Update progress
        const answered = answeredQuestions.filter(a => a === true).length;
        const progress = Math.round((answered / totalQuestions) * 100);
        progressFill.style.width = progress + '%';
        progressText.textContent = `${answered} of ${totalQuestions} answered`;

        // Update score
        scoreDisplay.textContent = score;
    }

    function handleOptionClick(idx) {
        if (showExplanation[currentIndex]) return;
        if (answeredQuestions[currentIndex]) return;

        const q = questions[currentIndex];
        const isCorrect = idx === q.correct;

        selectedAnswers[currentIndex] = idx;
        answeredQuestions[currentIndex] = true;

        if (isCorrect) {
            score++;
        }

        showExplanation[currentIndex] = true;
        renderQuestion();
    }

    function goToPrev() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function goToNext() {
        // Don't allow going next if question not answered and not at end
        if (!answeredQuestions[currentIndex] && currentIndex < totalQuestions - 1) {
            // Check if we're not on the last question
            // Allow skipping if they want to, but we'll let them
        }

        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            // Finish quiz
            if (!quizCompleted) {
                const percent = Math.round((score / totalQuestions) * 100);
                let message = '🎯 Quiz Complete!\n\n';
                message += `Score: ${score} out of ${totalQuestions}\n`;
                message += `Percentage: ${percent}%\n\n`;
                if (percent >= 90) message += 'Excellent! 🌟';
                else if (percent >= 70) message += 'Good job! 👍';
                else if (percent >= 50) message += 'Keep practicing! 📚';
                else message += 'Review the material and try again. 💪';

                alert(message);
                quizCompleted = true;
                renderQuestion();
            }
        }
    }

    // Event listeners
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);

    // Keyboard: left/right arrows
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && !prevBtn.disabled) {
            prevBtn.click();
        } else if (e.key === 'ArrowRight') {
            if (showExplanation[currentIndex] || answeredQuestions[currentIndex]) {
                nextBtn.click();
            }
        }
    });

    // Initialize
    renderQuestion();
</script>

</body>
</html>
